[package]
name = "oxdock"
description = "Dockerfile-inspired build DSL. Native. Embed scripts at compile time in Rust, or run the same scripts as standalone CLI pipelines."
categories = ["command-line-utilities", "development-tools"]
keywords = ["oxdock", "embed", "dsl", "mcp", "compile-time"]
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.cargo-udeps.ignore]
development = ["indoc"]

# Binary moved here from oxdock-cli; only built with the `cli` feature.
[[bin]]
name = "oxdock"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli", "net", "ssh", "markdown", "mcp"]
cli = ["dep:oxdock-cli"]
# Virtual-endpoint toolkit in the CLI runner (oxdock-net-plugin).
net = ["oxdock-cli/net"]
# Ephemeral SSH server/client in the CLI runner (oxdock-ssh-plugin).
ssh = ["cli", "net", "oxdock-cli/ssh"]
# Markdown helpers in the CLI runner (oxdock-markdown-plugin). On by
# default; `--no-default-features` builds drop the module.
markdown = ["oxdock-cli/markdown"]
# MCP tool hosting for EXPORTed script functions. On by default;
# `--no-default-features` builds drop it.
mcp = ["oxdock-cli/mcp"]

[dependencies]
oxdock-build.workspace = true
oxdock-cli = { workspace = true, optional = true }
oxdock-core.workspace = true
oxdock-func-macro.workspace = true
oxdock-macros.workspace = true
oxdock-parser.workspace = true

[dev-dependencies]
anyhow.workspace = true
indoc.workspace = true
oxdock-fs.workspace = true
oxdock-process.workspace = true

[lints]
workspace = true

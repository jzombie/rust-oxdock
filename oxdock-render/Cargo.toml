[package]
name = "oxdock-render"
description = "Generate text files from templates and data: READMEs, installers, and other release artifacts, rendered deterministically from a single pipeline config."
categories = ["command-line-utilities", "development-tools::build-utils"]
keywords = ["oxdock", "render", "templates", "artifacts"]
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "oxdock_render"
path = "src/lib.rs"

[[bin]]
name = "oxdock-render"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
base64.workspace = true
indoc.workspace = true
oxdock-core.workspace = true
oxdock-fs.workspace = true
oxdock-func-macro.workspace = true
oxdock-markdown-plugin.workspace = true
# Plugin crates are linked so their HostModules can be introspected
# in-process (static linking requires the edge). The reference path
# only reads metadata; it never serves, connects, or binds.
oxdock-net-plugin.workspace = true
oxdock-parser.workspace = true
oxdock-process.workspace = true
oxdock-ssh-plugin.workspace = true
serde_json.workspace = true
toml_edit.workspace = true

[dev-dependencies]
oxdock-macros.workspace = true
oxdock-sys-test-utils.workspace = true

[lints]
workspace = true

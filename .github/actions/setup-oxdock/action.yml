# Setup OxDock engine for `shell: oxdock` steps (`oxdock-engine` when renamed).
#
# Single installer: `release` runs the stub. Inputs cross on `env:`,
# every decision lives in the stub. `local` builds with cargo and
# installs directly (no `install.oxfile` needed). Stubs are fetched,
# never vendored.
#
# GENERATED by oxdock-render from `.oxdock/template/github-actions/`: do not
# edit by hand. The `run:` one-liners below render from the shared
# `installer_cmd_sh` / `installer_cmd_ps1` globals.
name: Setup OxDock engine
description: Install the oxdock interpreter so later steps can use shell oxdock.

inputs:
  version:
    description: Full release tag to install (e.g. v0.29.0-alpha), or `latest` to resolve the newest release. Ignored when source is `local`.
    required: false
    default: latest
  binary-name:
    description: Installed executable stem (`oxdock-engine` frees the bare `oxdock` name for a binary under test).
    required: false
    default: oxdock
  source:
    description: Engine provenance (`release` downloads the installer for `version`; `local` builds the caller's checkout with cargo, so unreleased DSL is testable before any tag exists). An empty value behaves as `release`, so callers may pass the OXDOCK_ENGINE_SOURCE workflow variable and select the provenance once in workflow `env:`; deleting that variable restores the release without touching any call site.
    required: false
    default: release

runs:
  using: composite
  steps:
    - name: Validate engine source input
      if: ${{ inputs.source != '' && inputs.source != 'release' && inputs.source != 'local' }}
      shell: bash
      run: |
        echo "Invalid source '${{ inputs.source }}': must be '', 'release', or 'local'" >&2
        exit 1
    - name: Install OxDock engine
      if: ${{ inputs.source != 'local' && runner.os != 'Windows' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ runner.temp }}/oxdock-engine
        OXDOCK_PRODUCT: oxdock
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
      run: curl -fsSL https://raw.githubusercontent.com/jzombie/rust-oxdock/main/install.sh | bash

    - name: Install OxDock engine
      if: ${{ inputs.source != 'local' && runner.os == 'Windows' }}
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ runner.temp }}/oxdock-engine
        OXDOCK_PRODUCT: oxdock
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
      run: (irm 'https://raw.githubusercontent.com/jzombie/rust-oxdock/main/install.ps1') | iex

    - name: Install Rust
      if: ${{ inputs.source == 'local' }}
      uses: dtolnay/rust-toolchain@stable

    - name: Build local OxDock engine
      if: ${{ inputs.source == 'local' && runner.os != 'Windows' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
      run: |
        set -euo pipefail
        TARGET_DIR="${CARGO_TARGET_DIR:-target}"
        cargo build --release -p oxdock
        INSTALL_DIR="${{ runner.temp }}/oxdock-engine"
        mkdir -p "$INSTALL_DIR"
        BINARY_NAME="${OXDOCK_BINARY_NAME:-oxdock}"
        cp "$TARGET_DIR/release/oxdock" "$INSTALL_DIR/$BINARY_NAME"
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
    - name: Build local OxDock engine
      if: ${{ inputs.source == 'local' && runner.os == 'Windows' }}
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
      run: |
        $ErrorActionPreference='Stop'
        $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { 'target' }
        cargo build --release -p oxdock
        $installDir = "$env:RUNNER_TEMP/oxdock-engine"
        New-Item -ItemType Directory -Force -Path $installDir | Out-Null
        $binaryName = if ($env:OXDOCK_BINARY_NAME) { $env:OXDOCK_BINARY_NAME } else { 'oxdock' }
        Copy-Item (Join-Path $targetDir 'release/oxdock.exe') (Join-Path $installDir "$binaryName.exe")
        Add-Content -Path $env:GITHUB_PATH -Value $installDir

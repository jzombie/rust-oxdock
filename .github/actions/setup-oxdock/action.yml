# Setup OxDock engine for `shell: oxdock` steps (`oxdock-engine` when renamed).
#
# Single installer: `release` runs the stub. Inputs cross on `env:`,
# every decision lives in the stub + `install.oxfile`. `local` builds
# with cargo, then reuses the same file. Stubs are fetched, never
# vendored.
#
# GENERATED by docs-gen from `.oxdock/template/github-actions/`: do not
# edit by hand. The `run:` one-liners below render from the shared
# `install-cmd-sh` / `install-cmd-ps1` fragments, the same single source
# the README stanzas use, so CI runs exactly the documented commands.
name: Setup OxDock engine
description: Install the oxdock interpreter so later steps can use shell oxdock.

inputs:
  version:
    description: Full release tag to install (e.g. v0.29.0-alpha), or `latest` to resolve the newest release. Ignored when source is `local`.
    required: false
    default: latest
  binary-name:
    description: Installed executable stem (`oxdock-engine` frees the bare `oxdock` name for a binary under test).
    required: false
    default: oxdock
  source:
    description: Engine provenance (`release` downloads the installer for `version`; `local` builds the caller's checkout with cargo, so unreleased DSL is testable before any tag exists). An empty value behaves as `release`, so callers may pass the OXDOCK_ENGINE_SOURCE workflow variable and select the provenance once in workflow `env:`; deleting that variable restores the release without touching any call site.
    required: false
    default: release

runs:
  using: composite
  steps:
    - name: Install OxDock engine
      if: ${{ inputs.source != 'local' && runner.os != 'Windows' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ runner.temp }}/oxdock-engine
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
      run: curl -fsSL https://raw.githubusercontent.com/jzombie/rust-oxdock/main/install.sh | bash

    - name: Install OxDock engine
      if: ${{ inputs.source != 'local' && runner.os == 'Windows' }}
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ runner.temp }}/oxdock-engine
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
      run: (irm 'https://raw.githubusercontent.com/jzombie/rust-oxdock/main/install.ps1') | iex

    - name: Install Rust
      if: ${{ inputs.source == 'local' }}
      uses: dtolnay/rust-toolchain@stable

    - name: Build local OxDock engine
      if: ${{ inputs.source == 'local' }}
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        OXDOCK_BIN: ${{ github.workspace }}/target/release/oxdock${{ runner.os == 'Windows' && '.exe' || '' }}
        OXDOCK_OXFILE: ${{ github.workspace }}/install.oxfile
        OXDOCK_DIR: ${{ runner.temp }}/oxdock-engine
        OXDOCK_VERSION: local
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
        OXDOCK_SKIP_DOWNLOAD: '1'
      run: |
        $ErrorActionPreference='Stop'
        cargo build --release -p oxdock
        & $env:OXDOCK_BIN $env:OXDOCK_OXFILE

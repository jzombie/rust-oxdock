# Setup OxDock engine for `shell: oxdock` steps (`oxdock-engine` when renamed).
#
# One pwsh step (present on every runner OS): fetch the release installer,
# run it, then the fresh engine runs post-install.oxfile (rename, PATH, smoke).
# Installers are fetched, never vendored (remote consumers check out only
# this directory); first bundled release is v0.24.4-alpha.
name: Setup OxDock engine
description: Install the oxdock interpreter so later steps can use shell oxdock.

inputs:
  version:
    description: Full release tag to install (e.g. v0.24.4-alpha), or `latest` to resolve the newest release.
    required: false
    default: latest
  binary-name:
    description: Installed executable stem (`oxdock-engine` frees the bare `oxdock` name for a binary under test).
    required: false
    default: oxdock

runs:
  using: composite
  steps:
    # The resolved tag passes explicitly so the installer fetches one
    # version's assets even if `latest` moves mid-run. Filenames carry
    # the platform extension computed here, so the DSL below never
    # branches on OS.
    - name: Install OxDock engine
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        # Downloaded scripts carry Mark of the Web; the default Windows
        # policy refuses them, and so would the bundled copy the
        # installer re-executes below. Process scope needs no admin and
        # covers the whole step, re-entry included. Windows-only cmdlet:
        # execution policy does not exist on other platforms.
        if ($IsWindows) {
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
        }
        # Shared runner IPs burn the anonymous API quota: authenticate
        # reads when a token is present (CI bridges GITHUB_TOKEN).
        # An empty table sends no headers.
        $ApiHeaders = @{}
        if ($env:GITHUB_TOKEN) { $ApiHeaders['Authorization'] = "Bearer $($env:GITHUB_TOKEN)" }
        $repo = 'jzombie/rust-oxdock'
        $enginedir = Join-Path $env:RUNNER_TEMP 'oxdock-engine'
        $scratch = Join-Path $env:RUNNER_TEMP 'oxdock-installer'
        New-Item -ItemType Directory -Force -Path $enginedir, $scratch | Out-Null
        $version = '${{ inputs.version }}'
        if ($version -eq 'latest') {
          # Same list endpoint the stub queries: `/releases/latest`
          # excludes pre-releases by contract.
          $version = (Invoke-RestMethod "https://api.github.com/repos/$repo/releases?per_page=1" -Headers $ApiHeaders)[0].tag_name
        }
        if ($IsWindows) {
          $stub = 'install.ps1'
          $execName = 'oxdock.exe'
          $wantName = '${{ inputs.binary-name }}.exe'
        } else {
          $stub = 'install.sh'
          $execName = 'oxdock'
          $wantName = '${{ inputs.binary-name }}'
        }
        Invoke-WebRequest "https://github.com/$repo/releases/download/$version/$stub" -Headers $ApiHeaders -OutFile (Join-Path $scratch $stub)
        $env:VERSION = $version
        $env:INSTALL_DIR = $enginedir
        if ($IsWindows) {
          & (Join-Path $scratch 'install.ps1')
        } else {
          bash (Join-Path $scratch 'install.sh')
        }
        # The engine just installed runs the rest: rename, PATH publish,
        # and a `--version` smoke check live in DSL, not in YAML strings.
        $env:OXDOCK_ENGINE_DIR = $enginedir
        $env:OXDOCK_ENGINE_SRC = $execName
        $env:OXDOCK_ENGINE_DST = $wantName
        & (Join-Path $enginedir $execName) (Join-Path $env:GITHUB_ACTION_PATH 'post-install.oxfile')

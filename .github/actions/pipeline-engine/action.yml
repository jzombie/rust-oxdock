# Pipeline engine at the pin, then a DSL confirmation of the pin.
#
# Acquire prefers the already-published binary at the pin and falls
# back to a source build when the ref has no release yet, so callers
# never pay a compile they can skip. Confirm re-derives the pin
# through helpers/ci-helpers.oxfile (PIPELINE_PIN) and fails on
# drift. Inputs cross on env, never interpolated into scripts.
name: Pipeline engine
description: Acquire the OxDock pipeline engine at the pinned ref and confirm the pin in DSL.
inputs:
  pin:
    description: Pipeline pin from the Resolve pipeline ref step.
    required: true
  checkout-path:
    description: Workspace path of the pipeline source checkout holding Cargo.toml and .github/scripts.
    required: true
  token:
    description: Token for downloading the published engine release.
    required: true
runs:
  using: composite
  steps:
    - name: Acquire pipeline engine
      shell: bash
      env:
        OXDOCK_PIN: ${{ inputs.pin }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        if gh release download "$OXDOCK_PIN" --clobber -R jzombie/rust-oxdock -p "oxdock-x86_64-unknown-linux-musl.tar.gz" -D /tmp/pipeline-dl; then
          mkdir -p /tmp/pipeline-bin
          tar -xzf /tmp/pipeline-dl/oxdock-x86_64-unknown-linux-musl.tar.gz -C /tmp/pipeline-bin
          chmod +x /tmp/pipeline-bin/oxdock
        fi

    - name: Confirm pipeline pin in DSL
      shell: bash
      env:
        OXDOCK_PIN: ${{ inputs.pin }}
        OXDOCK_CHECKOUT: ${{ inputs.checkout-path }}
      run: |
        set -euo pipefail
        tmp="$(mktemp)"
        trap 'rm -f "$tmp"' EXIT
        if [ -x /tmp/pipeline-bin/oxdock ]; then
          GITHUB_OUTPUT="$tmp" /tmp/pipeline-bin/oxdock "$OXDOCK_CHECKOUT/.github/scripts/gha-rust-pin.oxfile"
        else
          GITHUB_OUTPUT="$tmp" cargo run --quiet --manifest-path "$OXDOCK_CHECKOUT/Cargo.toml" -p oxdock -- "$OXDOCK_CHECKOUT/.github/scripts/gha-rust-pin.oxfile"
        fi
        if ! grep -qxF "pin=$OXDOCK_PIN" "$tmp"; then
          echo "DSL pin mismatch:" >&2
          cat "$tmp" >&2
          exit 1
        fi

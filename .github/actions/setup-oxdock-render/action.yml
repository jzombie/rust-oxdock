# Setup OxDock renderer for `oxdock-render` steps.
#
# Single installer: `release` runs the stub. Inputs cross on `env:`,
# every decision lives in the stub. `local` builds with cargo and
# installs directly (no `install.oxfile` needed). Stubs are fetched,
# never vendored.
#
# GENERATED by oxdock-render from `.oxdock/template/github-actions/`: do not
# edit by hand. The `run:` one-liners below render from the shared
# `installer_cmd_sh` / `installer_cmd_ps1` globals.
name: Setup OxDock renderer
description: Install the oxdock-render binary so later steps can render docs.

inputs:
  version:
    description: Full release tag to install (e.g. v0.37.0-alpha), or `latest` to resolve the newest release. Ignored when source is `local`.
    required: false
    default: latest
  binary-name:
    description: Installed executable stem (`oxdock-render` keeps the bare name free for a binary under test only when overridden).
    required: false
    default: oxdock-render
  source:
    description: Renderer provenance (`release` downloads the installer for `version`; `local` builds the caller's checkout with cargo, so unreleased renderer behavior is testable before any tag exists). An empty value behaves as `release`, so callers may pass the OXDOCK_RENDER_SOURCE workflow variable and select the provenance once in workflow `env:`; deleting that variable restores the release without touching any call site.
    required: false
    default: release

runs:
  using: composite
  steps:
    - name: Validate renderer source input
      if: ${{ inputs.source != '' && inputs.source != 'release' && inputs.source != 'local' }}
      shell: bash
      env:
        OXDOCK_SOURCE: ${{ inputs.source }}
      run: |
        echo "Invalid source '$OXDOCK_SOURCE': must be '', 'release', or 'local'" >&2
        exit 1
    - name: Install OxDock renderer
      if: ${{ inputs.source != 'local' && runner.os != 'Windows' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ runner.temp }}/oxdock-render
        OXDOCK_PRODUCT: oxdock-render
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
      run: curl -fsSL https://raw.githubusercontent.com/jzombie/rust-oxdock/main/install.sh | bash

    - name: Install OxDock renderer
      if: ${{ inputs.source != 'local' && runner.os == 'Windows' }}
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ runner.temp }}/oxdock-render
        OXDOCK_PRODUCT: oxdock-render
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
      run: (irm 'https://raw.githubusercontent.com/jzombie/rust-oxdock/main/install.ps1') | iex

    - name: Install Rust
      if: ${{ inputs.source == 'local' }}
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

    - name: Build local OxDock renderer
      if: ${{ inputs.source == 'local' && runner.os != 'Windows' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
      run: |
        set -euo pipefail
        TARGET_DIR="${CARGO_TARGET_DIR:-target}"
        cargo build --release -p oxdock -p oxdock-render --bins --all-features
        INSTALL_DIR="${{ runner.temp }}/oxdock-render"
        mkdir -p "$INSTALL_DIR"
        BINARY_NAME="${OXDOCK_BINARY_NAME:-oxdock-render}"
        cp "$TARGET_DIR/release/oxdock-render" "$INSTALL_DIR/$BINARY_NAME"
        for f in "$TARGET_DIR"/release/oxdock-render-*; do
          [ -f "$f" ] || continue
          case "$f" in *.d|*.pdb) continue;; *) cp "$f" "$INSTALL_DIR/";; esac
        done
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"
    - name: Build local OxDock renderer
      if: ${{ inputs.source == 'local' && runner.os == 'Windows' }}
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
      run: |
        $ErrorActionPreference='Stop'
        $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { 'target' }
        cargo build --release -p oxdock -p oxdock-render --bins --all-features
        $installDir = "$env:RUNNER_TEMP/oxdock-render"
        New-Item -ItemType Directory -Force -Path $installDir | Out-Null
        $binaryName = if ($env:OXDOCK_BINARY_NAME) { $env:OXDOCK_BINARY_NAME } else { 'oxdock-render' }
        Copy-Item (Join-Path $targetDir 'release/oxdock-render.exe') (Join-Path $installDir "$binaryName.exe")
        Get-ChildItem (Join-Path $targetDir 'release/oxdock-render-*') -File | Where-Object { $_.Extension -notin @('.d', '.pdb') } | ForEach-Object { Copy-Item $_.FullName $installDir }
        Add-Content -Path $env:GITHUB_PATH -Value $installDir

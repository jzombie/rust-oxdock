name: miri-nightly

# UB signal without blocking merges: Miri is too slow for the PR path
# (a full workspace run exceeds the 6-hour job limit), so it runs on a
# nightly schedule against main instead. PRs merge on the stable gate
# (test matrix, coverage, lint); Miri findings become follow-up issues.
# The runnable-ratio badge below still publishes on every run, so the
# README badge tracks main daily.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

# Nightly runs must not pile up if one overruns the 24h cadence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# OxDock steps below run on a branch-built engine: source stays local
# so the hash leg proves branch behavior (unreleased vocabulary like
# file IMPORT and HASH_SHA256 no tag provides yet). No pin here.
env:
  OXDOCK_ENGINE_SOURCE: local

jobs:
  miri:
    name: miri (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # No job-level OXDOCK_WORKSPACE_ROOT: `cargo miri test` executes
    # the suite, and the variable would leak into the test processes
    # and hijack root discovery there. OxDock steps below bridge it
    # per step instead; their children never run tests.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      # Latest nightly plus Miri: the dated pin went away with the
      # upstream ssh-key E0391 fix (#269, #272). Re-pin a dated nightly
      # deliberately if a new nightly breaks the build, never drift.
      - name: Install nightly toolchain with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      # Branch-built engine, never `latest`: a moving default would
      # change CI with no repo diff.
      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          source: ${{ env.OXDOCK_ENGINE_SOURCE }}

      # Local source builds install stable as the default toolchain.
      # Restore the nightly default so cargo miri below keeps
      # interpreting under nightly.
      - name: Restore nightly toolchain default
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      # Native hashing: HASH_SHA256 digests Cargo.lock directly, and
      # TEXT_EXTRACT picks the rustc commit out of the version report.
      # No sha256sum, shasum, awk, or sed.
      - name: Hash lockfile and toolchain
        id: hashes
        shell: oxdock --script {0}
        run: |
          INHERIT_ENV [GITHUB_OUTPUT, GITHUB_WORKSPACE]
          IMPORT [STD, ".github/scripts/helpers/ci-helpers.oxfile" AS CI_HELPERS]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          ENV CARGO_TARGET_DIR="{{ env:GITHUB_WORKSPACE }}/target"
          LET $lock: STRING = CI_HELPERS::LOCKFILE_HASH()
          ECHO "lockfile: {{ $lock }}"
          APPEND "{{ env:GITHUB_OUTPUT }}" "lockfile_hash={{ $lock }}\n"
          LET $report: STRING = RUN ["rustc", "-Vv"]
          LET $rustc: STRING = CI_HELPERS::RUSTC_HASH($report)
          ECHO "rustc: {{ $rustc }}"
          APPEND "{{ env:GITHUB_OUTPUT }}" "rustc_hash={{ $rustc }}\n"

      - name: Cache Cargo dependencies for Miri
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: miri-${{ runner.os }}-${{ steps.hashes.outputs.rustc_hash }}-${{ steps.hashes.outputs.lockfile_hash }}

      - name: Prepare Miri
        run: cargo miri setup

      - name: Run Miri (unit tests only)
        id: miri
        run: cargo miri test --workspace --all-features --lib --tests

      - name: Report Miri coverage
        # Always report: on a failing run the badge must turn red instead
        # of fossilizing at the last green publish. The boolean outcome
        # rides in via MIRI_FAILED below.
        if: always()
        shell: bash
        # Listings don't need interpretation: Miri ignores are
        # #[cfg_attr(miri, ignore)], i.e. compile-time, so a native
        # listing with the cfg set enumerates identically. This spares
        # two full Miri boots; only the test run above interprets.
        # Bare `cargo` resolves to the job's pinned nightly toolchain
        # (see the setup step above), matching every other step here;
        # no toolchain override: the workspace does not compile on
        # stable, so ambient nightly is required, not optional.
        # Pinned engine, never a source build: reporting only runs the
        # badge script, so compiling the tool would be pure waste.
        env:
          OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
          MIRI_TEST_CMD: RUSTFLAGS="--cfg miri" cargo test --workspace --all-features --lib --tests
          MIRI_FAILED: ${{ steps.miri.outcome != 'success' }}
        run: |
          set -euo pipefail
          oxdock ./.github/scripts/gha-miri-badge.oxfile

      - name: Publish Miri coverage badge
        # Publish on failure too: that is exactly when the badge must flip
        # to red. Branch gate stays: only main moves the public badge.
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: badges
          keep_files: true

name: miri-nightly

# UB signal without blocking merges: Miri is too slow for the PR path,
# so it runs on a nightly schedule against main instead of gating
# merges. PRs merge on the stable gate (test matrix, coverage, lint);
# Miri findings become follow-up issues. The runnable-ratio badge below
# still publishes on every run, so the README badge tracks main daily.
#
# Sharding: one matrix job per (crate, test-target) chunk, so no single
# job can hit the 6-hour execution limit (a full-workspace run proved
# it needs more: run 41846432872 timed out at 6h). The shard list is
# enumerated dynamically by gha-miri-matrix.oxfile (cargo metadata +
# test listings), so adding crates, targets, or tests needs no workflow
# edit. Bins and doctests stay out, matching the historical
# `cargo miri test --lib --tests` coverage exactly.
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

permissions:
  contents: read

# Nightly runs must not pile up if one overruns the 24h cadence.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# OxDock steps below run on a branch-built engine: source stays local
# so the hash leg proves branch behavior (unreleased vocabulary like
# file IMPORT and HASH_SHA256 no tag provides yet). No pin here.
env:
  OXDOCK_ENGINE_SOURCE: local

jobs:
  enumerate:
    name: enumerate miri shards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
      cache_key: ${{ steps.shards.outputs.cache_key }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Follow the triggering ref, not a pinned branch: scheduled
          # runs trigger on the default branch (main), while manual
          # dispatches must test the selected branch, not main.
          ref: ${{ github.ref }}

      # Plain nightly: listing builds natively with cfg(miri) set (Miri
      # ignores are compile-time), so the Miri component is unneeded
      # here; matrix jobs install it for the interpreting runs.
      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      # Branch-built engine, never `latest`: a moving default would
      # change CI with no repo diff.
      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          source: ${{ env.OXDOCK_ENGINE_SOURCE }}

      # Local source builds install stable as the default toolchain.
      # Restore the nightly default so cargo below keeps interpreting
      # under nightly.
      - name: Restore nightly toolchain default
        uses: dtolnay/rust-toolchain@nightly

      # Registry plus native target/: the listing builds every native
      # test target, and the report job restores this same entry so its
      # listing build is incremental instead of clean. Native only:
      # never the Miri key below (different fingerprints).
      - name: Cache Cargo registry and native target for listing
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: miri-enumerate-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      # Shard discovery runs under cfg(miri) so the listing enumerates
      # exactly the set Miri will see (ignores are compile-time).
      - name: Enumerate Miri shards
        id: shards
        shell: bash
        env:
          RUSTFLAGS: "--cfg miri"
        run: |
          set -euo pipefail
          oxdock ./.github/scripts/gha-miri-matrix.oxfile

  miri:
    name: miri shard #${{ matrix.shard.index }} (${{ matrix.shard.package }} ${{ matrix.shard.args }})
    needs: enumerate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.enumerate.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Same ref rule as enumerate: manual dispatches test the
          # selected branch, not main.
          ref: ${{ github.ref }}

      # Latest nightly plus Miri: the dated pin went away with the
      # upstream ssh-key E0391 fix (#269, #272). Re-pin a dated nightly
      # deliberately if a new nightly breaks the build, never drift.
      - name: Install nightly toolchain with Miri
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      # No engine build here: this job runs raw cargo only, so there
      # is no stable default to restore either.

      # One shared key across all shards, deliberately: concurrent
      # saves to an immutable key are skipped, not failed, and every
      # shard restores the same entry. Dependency fingerprints match
      # across shards (identical toolchain, lockfile, flags, source),
      # so each shard only recompiles its own crate's test binaries.
      # Per-shard keys would store ~79 copies of multi-GB Miri
      # target/ dirs against the 10GB repo quota and evict everything.
      - name: Cache Cargo dependencies for Miri
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ needs.enumerate.outputs.cache_key }}

      - name: Prepare Miri
        run: cargo miri setup

      # One shard: disjoint --exact filters, so shards partition the
      # historical workspace coverage without overlap.
      - name: Run Miri shard
        run: cargo miri test -p ${{ matrix.shard.package }} --all-features ${{ matrix.shard.args }} -- --exact ${{ matrix.shard.tests }}

  report:
    name: report miri coverage
    needs: [enumerate, miri]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          source: ${{ env.OXDOCK_ENGINE_SOURCE }}

      - name: Restore nightly toolchain default
        uses: dtolnay/rust-toolchain@nightly

      # Native listing needs the native build cache, not the Miri one:
      # restore enumerate's entry (registry plus native target/) so the
      # listing build below is incremental. No Miri component here:
      # nothing in this job interprets.
      - name: Cache Cargo registry and native target for listing
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: miri-enumerate-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Report Miri coverage
        # Always report: on a failing run the badge must turn red instead
        # of fossilizing at the last green publish. Any non-success across
        # the matrix (a shard failed, or enumeration itself failed) rides
        # in as a failing badge.
        if: always()
        shell: bash
        # Listings don't need interpretation: Miri ignores are
        # #[cfg_attr(miri, ignore)], i.e. compile-time, so a native
        # listing with the cfg set enumerates identically. This spares
        # two full Miri boots; only the matrix jobs interpret.
        # Bare `cargo` resolves to the job's pinned nightly toolchain
        # (see the setup step above), matching every other step here;
        # no toolchain override: the workspace does not compile on
        # stable, so ambient nightly is required, not optional.
        # Pinned engine, never a source build: reporting only runs the
        # badge script, so compiling the tool would be pure waste.
        env:
          OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
          MIRI_TEST_CMD: RUSTFLAGS="--cfg miri" cargo test --workspace --all-features --lib --tests
          MIRI_FAILED: ${{ needs.miri.result != 'success' }}
        run: |
          set -euo pipefail
          oxdock ./.github/scripts/gha-miri-badge.oxfile

      - name: Publish Miri coverage badge
        # Publish on failure too: that is exactly when the badge must flip
        # to red. Branch gate stays: only main moves the public badge.
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: badges
          publish_dir: badges
          keep_files: true

# Settings convergence: applies .github/settings.json through
# .github/scripts/gha-apply-settings.oxfile so repo configuration never drifts
# silently. Runs when the settings or the script change, weekly
# against UI-side drift, and on demand. Secrets converge only when
# their values exist: the very first secret still needs one manual
# `gh secret set` (automation cannot invent the crates.io token), and
# every run after that keeps it converged from the bridged value.
#
# One-time setup (repo settings, not code): create a fine-grained
# personal access token with Administration read-write plus Secrets
# read-write on this repository (extend to the fleet later) and store
# it as the SETTINGS_PAT secret. GITHUB_TOKEN cannot administer
# environments or write secrets under any permission set, so this job
# authenticates `gh` with the PAT instead.

name: settings

on:
  push:
    branches: [main]
    paths:
      - ".github/settings.json"
      - ".github/scripts/gha-apply-settings.oxfile"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Pinned engine, never a source build and never `latest`: this job only
# runs the convergence script, so compiling the tool would be pure waste,
# and a moving default would change CI with no repo diff. Bump only after
# a newer tag proves green.
env:
  OXDOCK_PINNED_ENGINE: v0.32.0-alpha

jobs:
  settings:
    name: settings
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The pin lives in top-level `env`, not here.
      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: ${{ env.OXDOCK_PINNED_ENGINE }}

      - name: Apply settings
        shell: bash
        env:
          OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
          GH_TOKEN: ${{ secrets.SETTINGS_PAT }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          oxdock ./.github/scripts/gha-apply-settings.oxfile

          # Source truth for version identity: the installed binary must
          # report the manifest version. No second binary to compare
          # against: every `oxdock` here is branch bytes already.
          LET $manifest: MAP<ANY> = LOAD_TOML("Cargo.toml")

          ENV OXDOCK_RELEASE_BASE="http://127.0.0.1:{{ env:SMOKE_PORT }}"
          LET $srv: HANDLE = ASYNC { RUN ["python3", "-m", "http.server", "{{ env:SMOKE_PORT }}", "--bind", "127.0.0.1", "--directory", "{{ env:RUNNER_TEMP }}/oxdock-stage"] }


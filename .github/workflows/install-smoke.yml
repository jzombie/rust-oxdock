          ASSERT_CONTAINS $e "downloading oxdock local-test"
          ASSERT_CONTAINS $o "installed oxdock local-test to "
          [family:unix] ASSERT_CONTAINS $o "to {{ env:HOME }}/.local/bin"
          [family:windows] ASSERT_CONTAINS $o "to {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps"
          [family:unix] ASSERT_CONTAINS $o "ensure {{ env:HOME }}/.local/bin is on PATH"
          [family:windows] ASSERT_CONTAINS $o "ensure {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps is on PATH"

          # Configured shell: the stub asks users to put the install dir
          # on PATH, so do that here; bare names below then reach the
          # product on both platforms. Windows needs nothing: WindowsApps
          # is already on PATH.

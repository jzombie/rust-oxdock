# Installer smoke: runs the tree's install fetchers into temp dirs
# and executes the installed binary. Static checks (lint) prove the
# stubs parse; this proves they install. Steps run DSL directly
# (`shell: oxdock --script {0}`): leg bodies live inline, one step per
# leg, platform guards inside, so there is no shell logic and no
# separate script file to drift. Self-hosted end to end: the pinned
# engine interprets exactly one step (the branch build), which publishes
# the just-built binary onto PATH; every leg below is interpreted by
# branch bytes. The fetch source is
# a staged branch build served over loopback, never a published tag:
# branch bytes prove end to end, and the installer engine is the same
# branch build, so behavior fixes prove before any release ships them.
# One leg leaves VERSION unset so the release-API resolution line
# executes for real (TODO: consolidate those legs on exact `--version`
# once the newest published release supports the flag). Weekly plus on
# demand; also runs on pushes to main so stub changes prove before
# users meet them.

name: install-smoke

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "install.ps1"
      - "install.oxfile"
      - ".oxdock/template/readme/install.*.tmpl"
      - ".oxdock/template/cli/**"
      - "scripts/smoke/**"
      - ".github/actions/setup-oxdock/**"
      - ".github/workflows/install-smoke.yml"
  pull_request:
    paths:
      - "install.sh"
      - "install.ps1"
      - "install.oxfile"
      - ".oxdock/template/readme/install.*.tmpl"
      - ".oxdock/template/cli/**"
      - "scripts/smoke/**"
      - ".github/actions/setup-oxdock/**"
      - ".github/workflows/install-smoke.yml"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  parse:
    name: parse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Static gate before any download runs: shell natively, PowerShell
      # through its own parser API (single quotes keep bash from eating
      # its `$` variables under `set -u`).
      - name: Check install scripts parse
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          pwsh -NoProfile -Command '$e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$e); if ($e.Count -gt 0) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          bash -n scripts/smoke/run-ephemeral.sh
          pwsh -NoProfile -Command '$e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/smoke/run-ephemeral.ps1", [ref]$null, [ref]$e); if ($e.Count -gt 0) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }'

  smoke:
    name: smoke (${{ matrix.os }})
    needs: [parse]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    # The stubs forward GITHUB_TOKEN when present, exactly as real
    # user runs may; loopback fetches ignore it harmlessly.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Temp-file DSL steps resolve the workspace through this, never
      # through the script path: GitHub stages `run:` blocks outside the
      # checkout, so discovery would misresolve without the override.
      OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
      # Test the branch's own installer logic, not whatever main happens
      # to carry: head branch on PRs, branch name otherwise. Unset on no
      # known branch would skip the override; every event here has one.
      OXDOCK_OXFILE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/install.oxfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The engine arrives via the reusable setup action (pinned here;
      # downstream projects omit `version` for latest): platform
      # detection, checksums, and placement already live in the
      # installers, so no asset matrix is repeated. Pin is exact and
      # bumped deliberately; an old engine choking on new syntax fails
      # loudly here rather than haunting later steps. VERSION pins the
      # engine; the branch under test is built from source next.
      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: v0.24.2-alpha

      # The binary under test is this branch, never a published tag:
      # behavior fixes prove before any release ships them. Same build
      # the release ships (all features), by package name. The build
      # doubles as the staged release served below.
      - name: Build branch binary
        id: branch-bin
        shell: oxdock --script {0}
        run: |
          IMPORT [STD]
          INHERIT_ENV [GITHUB_OUTPUT, GITHUB_PATH, GITHUB_WORKSPACE, RUNNER_TEMP]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}

          # Nested cargo builds run isolated in a temp target dir
          # unless told otherwise; pin it to the workspace so the
          # staged paths below resolve. Safe here: no concurrent outer
          # cargo shares this runner job.
          [family:unix] ENV CARGO_TARGET_DIR="{{ env:GITHUB_WORKSPACE }}/target"
          [family:windows] ENV CARGO_TARGET_DIR="{{ env:GITHUB_WORKSPACE }}\\target"

          RUN ["cargo", "build", "--release", "-p", "oxdock", "--all-features"]

          # Identity, exact-free: the binary must report itself, and the
          # manifest line is echoed for the log. Exact equality needs
          # string surgery the DSL has no vocabulary for; the release
          # gate enforces version equality authoritatively later.
          LET $p1: PIPE
          WITH_IO [stdout=$p1] RUN ["grep", "^version = ", "Cargo.toml"]
          WITH_IO [stdin=$p1] READ_LINE $manifest
          ECHO "manifest: {{ $manifest }}"

          LET $p2: PIPE
          [family:unix] WITH_IO [stdout=$p2] RUN ["{{ env:GITHUB_WORKSPACE }}/target/release/oxdock", "--version"]
          [family:windows] WITH_IO [stdout=$p2] RUN ["{{ env:GITHUB_WORKSPACE }}\\target\\release\\oxdock.exe", "--version"]
          WITH_IO [stdin=$p2] READ_LINE $reported
          ASSERT_CONTAINS $reported "oxdock "

          # Stage a local release of the branch build: every leg below
          # fetches through the stub from loopback, so branch bytes
          # prove and no published tag is involved. Layout mirrors a
          # real release asset dir; the target mapping mirrors the stub.
          [os:macos] LET $target: STRING = "aarch64-apple-darwin"
          [os:linux, arch:x86_64] LET $target: STRING = "x86_64-unknown-linux-musl"
          [os:linux, arch:aarch64] LET $target: STRING = "aarch64-unknown-linux-musl"
          [os:windows, arch:x86_64] LET $target: STRING = "x86_64-pc-windows-msvc"
          [os:windows, arch:aarch64] LET $target: STRING = "aarch64-pc-windows-msvc"
          [family:unix] LET $assetbin: STRING = "oxdock"
          [family:windows] LET $assetbin: STRING = "oxdock.exe"
          LET $asset: STRING = "oxdock-{{ $target }}.tar.gz"
          [family:unix] LET $stage: STRING = "{{ env:RUNNER_TEMP }}/oxdock-stage"
          [family:windows] LET $stage: STRING = "{{ env:RUNNER_TEMP }}\\oxdock-stage"
          MKDIR {{ $stage }}
          COPY target/release/{{ $assetbin }} {{ $stage }}/{{ $assetbin }}
          WORKDIR {{ $stage }}

          # Relative archive name: GNU tar reads `host:file` in an
          # absolute Windows path as a remote tape (`D:` looks like a
          # host), so archive from inside the stage dir instead.
          RUN ["tar", "-czf", "{{ $asset }}", "{{ $assetbin }}"]

          # Checksum tool mirrors the stub per platform exactly.
          LET $p3: PIPE
          [os:linux] WITH_IO [stdout=$p3] RUN ["sha256sum", "{{ $asset }}"]
          [os:macos] WITH_IO [stdout=$p3] RUN ["shasum", "-a", "256", "{{ $asset }}"]
          [os:windows] WITH_IO [stdout=$p3] RUN ["sha256sum", "{{ $asset }}"]
          WITH_IO [stdin=$p3] READ_LINE $sums
          WRITE SHA256SUMS "{{ $sums }}"

          # Engine path for the legs below, in native separators: exec
          # position only accepts literals or `env:` templates, so the
          # legs bridge this output instead of joining it themselves.
          [family:unix] APPEND {{ env:GITHUB_OUTPUT }} "path={{ env:GITHUB_WORKSPACE }}/target/release/oxdock"
          [family:windows] APPEND {{ env:GITHUB_OUTPUT }} "path={{ env:GITHUB_WORKSPACE }}\\target\\release\\oxdock.exe"

          # Publish the build output dir: subsequent `shell: oxdock`
          # steps resolve the just-built binary through PATH, so every
          # leg below is interpreted by branch bytes, not the pinned
          # engine (which interprets only this build step). True
          # self-hosting from here on; a broken branch binary fails its
          # own legs loudly instead of being masked.
          [family:unix] APPEND {{ env:GITHUB_PATH }} "{{ env:GITHUB_WORKSPACE }}/target/release"
          [family:windows] APPEND {{ env:GITHUB_PATH }} "{{ env:GITHUB_WORKSPACE }}\\target\\release"

      # TODO: OxDock could resolve latest on its own with a new plugin module
      # dedicated for version tracking, etc.
      #
      # Pinned by the newest-release legs below: the stub resolves the
      # newest tag itself there, and the workflow must expect the same
      # one. Authenticated: shared runner IPs burn the anonymous quota.
      # No `grep -m1`: every stage must consume the body to EOF, else
      # curl fails writing to the closed pipe under pipefail (exit 23).
      # `per_page=1` yields exactly one `tag_name`, so nothing is lost.
      # Stays shell deliberately: stripping the `v` prefix is string
      # surgery the DSL has no vocabulary for, and this is six lines.
      - name: Resolve newest release
        id: smoke-version
        shell: bash
        run: |
          set -euo pipefail
          tag=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/jzombie/rust-oxdock/releases?per_page=1" | grep '"tag_name"' | cut -d'"' -f4)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # Every leg below fetches the staged branch build through the
      # stub from loopback: VERSION stays pinned so no release API is
      # involved, and the stub populates a cold cache from the server.
      - name: Install and run
        shell: oxdock --script {0}
        env:
          VERSION: local-test
          INSTALL_DIR_NIX: ${{ runner.temp }}/oxbin
          INSTALL_DIR_WIN: ${{ runner.temp }}\oxbin
          INSTALL_BIN_NIX: ${{ runner.temp }}/oxbin/oxdock
          INSTALL_BIN_WIN: ${{ runner.temp }}\oxbin\oxdock.exe
          # Loopback port for this leg; server, probe, and release base derive from it.
          SMOKE_PORT: 18731
          OXDOCK_ENGINE: ${{ steps.branch-bin.outputs.path }}
        run: |
          IMPORT [STD]
          INHERIT_ENV [OXDOCK_ENGINE, OXDOCK_OXFILE_URL, SMOKE_PORT, INSTALL_DIR_NIX, INSTALL_DIR_WIN, INSTALL_BIN_NIX, INSTALL_BIN_WIN, VERSION, RUNNER_TEMP, GITHUB_WORKSPACE, HOME, USERPROFILE, GITHUB_TOKEN]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          [family:unix] ENV INSTALL_DIR="{{ env:INSTALL_DIR_NIX }}"
          [family:windows] ENV INSTALL_DIR="{{ env:INSTALL_DIR_WIN }}"
          # Own loopback port per leg, bound to IPv4 explicitly: a server
          # lingering from an earlier leg must never fail this bind.
          ENV OXDOCK_RELEASE_BASE="http://127.0.0.1:{{ env:SMOKE_PORT }}"
          LET $srv: HANDLE = ASYNC { RUN ["python3", "-m", "http.server", "{{ env:SMOKE_PORT }}", "--bind", "127.0.0.1", "--directory", "{{ env:RUNNER_TEMP }}/oxdock-stage"] }
          SLEEP 5s
          [family:unix] RUN ["curl", "-fsS", "http://127.0.0.1:{{ env:SMOKE_PORT }}/"]
          [family:windows] RUN ["curl.exe", "-fsS", "http://127.0.0.1:{{ env:SMOKE_PORT }}/"]
          [family:unix] RUN ["bash", "./install.sh"]
          [family:windows] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\install.ps1"]
          LET $p1: PIPE
          [family:unix] WITH_IO [stdout=$p1] RUN ["{{ env:INSTALL_BIN_NIX }}", "--version"]
          [family:windows] WITH_IO [stdout=$p1] RUN ["{{ env:INSTALL_BIN_WIN }}", "--version"]
          WITH_IO [stdin=$p1] READ_LINE $got
          LET $p2: PIPE
          WITH_IO [stdout=$p2] RUN ["{{ env:OXDOCK_ENGINE }}", "--version"]
          WITH_IO [stdin=$p2] READ_LINE $want
          ASSERT_EQ $got $want
          LET $p: PIPE
          LET $t: HANDLE = ASYNC {
              WITH_IO [stdout=$p] ECHO "IMPORT [STD]"
              WITH_IO [stdout=$p] ECHO "ECHO via-stdin"
          }
          [family:unix] WITH_IO [stdin=$p] RUN ["{{ env:INSTALL_BIN_NIX }}", "--script", "-"]
          [family:windows] WITH_IO [stdin=$p] RUN ["{{ env:INSTALL_BIN_WIN }}", "--script", "-"]
          AWAIT $t
          ASSERT_CONTAINS stdout "via-stdin"
          CANCEL $srv

      # Ephemeral run: executes the template-rendered one-liners that
      # the README also publishes, so documented commands stay tested.
      - name: Ephemeral run
        shell: oxdock --script {0}
        env:
          VERSION: local-test
          INSTALL_DIR_NIX: ${{ runner.temp }}/oxbin-ephemeral
          INSTALL_DIR_WIN: ${{ runner.temp }}\oxbin-ephemeral
          # Loopback port for this leg; server, probe, and release base derive from it.
          SMOKE_PORT: 18732
          OXDOCK_ENGINE: ${{ steps.branch-bin.outputs.path }}
        run: |
          IMPORT [STD]
          INHERIT_ENV [OXDOCK_ENGINE, OXDOCK_OXFILE_URL, SMOKE_PORT, INSTALL_DIR_NIX, INSTALL_DIR_WIN, VERSION, RUNNER_TEMP, GITHUB_WORKSPACE, HOME, USERPROFILE, GITHUB_TOKEN]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          [family:unix] ENV INSTALL_DIR="{{ env:INSTALL_DIR_NIX }}"
          [family:windows] ENV INSTALL_DIR="{{ env:INSTALL_DIR_WIN }}"
          ENV TMPDIR="{{ env:GITHUB_WORKSPACE }}/target/ephemeral-tmp"
          [family:windows] ENV TMP="{{ env:GITHUB_WORKSPACE }}/target/ephemeral-tmp"
          MKDIR "{{ env:GITHUB_WORKSPACE }}/target/ephemeral-tmp"
          # Own loopback port for this leg; shared binds flake across legs.
          ENV OXDOCK_RELEASE_BASE="http://127.0.0.1:{{ env:SMOKE_PORT }}"
          LET $srv: HANDLE = ASYNC { RUN ["python3", "-m", "http.server", "{{ env:SMOKE_PORT }}", "--bind", "127.0.0.1", "--directory", "{{ env:RUNNER_TEMP }}/oxdock-stage"] }
          SLEEP 5s
          [family:unix] RUN ["curl", "-fsS", "http://127.0.0.1:{{ env:SMOKE_PORT }}/"]
          [family:windows] RUN ["curl.exe", "-fsS", "http://127.0.0.1:{{ env:SMOKE_PORT }}/"]
          [family:unix] RUN ["bash", "scripts/smoke/run-ephemeral.sh"]
          [family:windows] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\scripts\\smoke\\run-ephemeral.ps1"]
          ASSERT_CONTAINS stdout "via-ephemeral"
          CANCEL $srv
          LET $t2: STRING = PATH_TYPE("{{ env:INSTALL_DIR }}")
          ASSERT_EQ $t2 "absent"
          FOR $f: STRING IN GLOB("target/ephemeral-tmp/*") {
              ECHO "scratch leaked: {{ $f }}"
              EXIT 1
          }

      # TODO: consolidate on exact `--version` once the newest published
      # release supports the flag. This leg leaves VERSION unset so the
      # stub's release-API resolution executes for real; the payload is
      # whatever is newest, checked via its `--help` menu.
      - name: Install newest release
        shell: oxdock --script {0}
        env:
          INSTALL_DIR_NIX: ${{ runner.temp }}/oxbin-newest
          INSTALL_DIR_WIN: ${{ runner.temp }}\oxbin-newest
          INSTALL_BIN_NIX: ${{ runner.temp }}/oxbin-newest/oxdock
          INSTALL_BIN_WIN: ${{ runner.temp }}\oxbin-newest\oxdock.exe
          OXDOCK_CACHE_DIR_NIX: ${{ runner.temp }}/oxcache-newest
          OXDOCK_CACHE_DIR_WIN: ${{ runner.temp }}\oxcache-newest
          SMOKE_TAG: ${{ steps.smoke-version.outputs.tag }}
          SMOKE_VERSION: ${{ steps.smoke-version.outputs.version }}
          OXDOCK_ENGINE: ${{ steps.branch-bin.outputs.path }}
        run: |
          IMPORT [STD]
          INHERIT_ENV [OXDOCK_ENGINE, OXDOCK_OXFILE_URL, INSTALL_DIR_NIX, INSTALL_DIR_WIN, INSTALL_BIN_NIX, INSTALL_BIN_WIN, OXDOCK_CACHE_DIR_NIX, OXDOCK_CACHE_DIR_WIN, SMOKE_TAG, SMOKE_VERSION, RUNNER_TEMP, GITHUB_WORKSPACE, HOME, USERPROFILE, GITHUB_TOKEN]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          [family:unix] ENV INSTALL_DIR="{{ env:INSTALL_DIR_NIX }}"
          [family:windows] ENV INSTALL_DIR="{{ env:INSTALL_DIR_WIN }}"
          # Cold cache: the engine install above warms the shared cache
          # for this same tag, which would report reuse instead of the
          # fresh download this leg asserts.
          [family:unix] ENV OXDOCK_CACHE_DIR="{{ env:OXDOCK_CACHE_DIR_NIX }}"
          [family:windows] ENV OXDOCK_CACHE_DIR="{{ env:OXDOCK_CACHE_DIR_WIN }}"
          LET $e: PIPE
          [family:unix] WITH_IO [stderr=$e] RUN ["bash", "./install.sh"]
          [family:windows] WITH_IO [stderr=$e] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\install.ps1"]
          # Full-content match: the announcement is not guaranteed to be
          # the first stderr line on every stub path and platform, so a
          # first-line read goes flaky where a substring holds steady.
          ASSERT_CONTAINS $e "downloading oxdock {{ env:SMOKE_TAG }}"
          LET $p: PIPE
          [family:unix] WITH_IO [stdout=$p] RUN ["{{ env:INSTALL_BIN_NIX }}", "--help"]
          [family:windows] WITH_IO [stdout=$p] RUN ["{{ env:INSTALL_BIN_WIN }}", "--help"]
          WITH_IO [stdin=$p] READ_LINE $first
          ASSERT_CONTAINS $first "{{ env:SMOKE_VERSION }}"
          LET $q: PIPE
          LET $t: HANDLE = ASYNC {
              WITH_IO [stdout=$q] ECHO "IMPORT [STD]"
              WITH_IO [stdout=$q] ECHO "ECHO via-stdin"
          }
          [family:unix] WITH_IO [stdin=$q] RUN ["{{ env:INSTALL_BIN_NIX }}", "--script", "-"]
          [family:windows] WITH_IO [stdin=$q] RUN ["{{ env:INSTALL_BIN_WIN }}", "--script", "-"]
          AWAIT $t
          ASSERT_CONTAINS stdout "via-stdin"

      # Same job, so $HOME (and the cache) persists: warm reuse must
      # skip downloads, corruption must heal by redownloading. The stub
      # announces which path it took; assert the first stderr line.
      - name: Reuse and heal cache
        shell: oxdock --script {0}
        env:
          VERSION: local-test
          INSTALL_DIR_NIX: ${{ runner.temp }}/oxbin-warm
          INSTALL_DIR_WIN: ${{ runner.temp }}\oxbin-warm
          INSTALL_BIN_NIX: ${{ runner.temp }}/oxbin-warm/oxdock
          INSTALL_BIN_WIN: ${{ runner.temp }}\oxbin-warm\oxdock.exe
          # Loopback port for this leg; server, probe, and release base derive from it.
          SMOKE_PORT: 18733
          OXDOCK_ENGINE: ${{ steps.branch-bin.outputs.path }}
        run: |
          IMPORT [STD]
          INHERIT_ENV [OXDOCK_ENGINE, OXDOCK_OXFILE_URL, SMOKE_PORT, INSTALL_DIR_NIX, INSTALL_DIR_WIN, INSTALL_BIN_NIX, INSTALL_BIN_WIN, VERSION, RUNNER_TEMP, GITHUB_WORKSPACE, HOME, USERPROFILE, GITHUB_TOKEN]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          [family:unix] ENV INSTALL_DIR="{{ env:INSTALL_DIR_NIX }}"
          [family:windows] ENV INSTALL_DIR="{{ env:INSTALL_DIR_WIN }}"
          # Own loopback port for this leg; shared binds flake across legs.
          ENV OXDOCK_RELEASE_BASE="http://127.0.0.1:{{ env:SMOKE_PORT }}"
          LET $srv: HANDLE = ASYNC { RUN ["python3", "-m", "http.server", "{{ env:SMOKE_PORT }}", "--bind", "127.0.0.1", "--directory", "{{ env:RUNNER_TEMP }}/oxdock-stage"] }
          SLEEP 5s
          [family:unix] RUN ["curl", "-fsS", "http://127.0.0.1:{{ env:SMOKE_PORT }}/"]
          [family:windows] RUN ["curl.exe", "-fsS", "http://127.0.0.1:{{ env:SMOKE_PORT }}/"]
          LET $e1: PIPE
          [family:unix] WITH_IO [stderr=$e1] RUN ["bash", "./install.sh"]
          [family:windows] WITH_IO [stderr=$e1] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\install.ps1"]
          ASSERT_CONTAINS $e1 "using cached"
          [family:unix] RUN ["{{ env:INSTALL_BIN_NIX }}", "--help"]
          [family:windows] RUN ["{{ env:INSTALL_BIN_WIN }}", "--help"]
          [os:macos] LET $asset: STRING = "oxdock-aarch64-apple-darwin.tar.gz"
          [os:linux, arch:x86_64] LET $asset: STRING = "oxdock-x86_64-unknown-linux-musl.tar.gz"
          [os:linux, arch:aarch64] LET $asset: STRING = "oxdock-aarch64-unknown-linux-musl.tar.gz"
          [os:windows, arch:x86_64] LET $asset: STRING = "oxdock-x86_64-pc-windows-msvc.tar.gz"
          [os:windows, arch:aarch64] LET $asset: STRING = "oxdock-aarch64-pc-windows-msvc.tar.gz"
          LET $cacheroot: STRING = "{{ env:OXDOCK_CACHE_DIR }}"
          IF $cacheroot == "" {
              [family:unix] $cacheroot = "{{ env:HOME }}/.cache/oxdock"
              [family:windows] $cacheroot = "{{ env:USERPROFILE }}/.cache/oxdock"
          }
          WRITE {{ $cacheroot }}/local-test/{{ $asset }} "corrupt"
          LET $e2: PIPE
          [family:unix] WITH_IO [stderr=$e2] RUN ["bash", "./install.sh"]
          [family:windows] WITH_IO [stderr=$e2] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\install.ps1"]
          ASSERT_CONTAINS $e2 "downloading"
          [family:unix] RUN ["{{ env:INSTALL_BIN_NIX }}", "--help"]
          [family:windows] RUN ["{{ env:INSTALL_BIN_WIN }}", "--help"]
          CANCEL $srv

      # Blackholed egress: with a warm cache and pinned resolution,
      # nothing may leave the machine. Lowercase proxy vars only:
      # GitHub treats env keys case-insensitively, so carrying both
      # cases is a duplicate key and kills the run at startup. The
      # canary first proves the blackhole holds; without it a silently
      # ignored proxy would pass vacuously. Unix legs only (see above).
      - name: Install offline
        if: ${{ runner.os != 'Windows' }}
        shell: oxdock --script {0}
        env:
          VERSION: local-test
          INSTALL_DIR_NIX: ${{ runner.temp }}/oxbin-offline
          INSTALL_BIN_NIX: ${{ runner.temp }}/oxbin-offline/oxdock
          OXDOCK_ENGINE: ${{ steps.branch-bin.outputs.path }}
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
        run: |
          IMPORT [STD]
          INHERIT_ENV [OXDOCK_ENGINE, OXDOCK_OXFILE_URL, INSTALL_DIR_NIX, INSTALL_BIN_NIX, VERSION, RUNNER_TEMP, GITHUB_WORKSPACE, HOME, USERPROFILE, http_proxy, https_proxy]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          ENV INSTALL_DIR="{{ env:INSTALL_DIR_NIX }}"
          RUN ["sh", "-c", "! curl -fsSL --max-time 15 https://github.com"]
          RUN ["bash", "./install.sh"]
          RUN ["{{ env:INSTALL_BIN_NIX }}", "--help"]

    name: newest (${{ matrix.os }})
    needs: [parse, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, windows-latest, windows-11-arm]
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download staged release
        uses: actions/download-artifact@v4
        with:
          name: smoke-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/oxdock-stage

      # Bootstrap interpreter only: installed as `oxdock-engine` so the
      # bare `oxdock` name stays free for the binary under test. Pinned,
      # so legs stay within a stable vocabulary.
      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: ${{ env.OXDOCK_PINNED_ENGINE }}
          source: ${{ env.OXDOCK_ENGINE_SOURCE }}
          binary-name: oxdock-engine

      # Pinned by this leg itself: the stub resolves the newest tag
      # here, and the leg expects the same one. Authenticated: shared
      # runner IPs burn the anonymous quota. No `grep -m1`: every stage
      # must consume the body to EOF, else curl fails writing to the
      # closed pipe under pipefail (exit 23). Stays shell deliberately:
      # stripping the `v` prefix is string surgery the DSL has no
      # vocabulary for, and this is six lines.
      - name: Resolve newest release
        id: smoke-version
        shell: bash
        run: |
          set -euo pipefail
          tag=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/jzombie/rust-oxdock/releases?per_page=1" | grep '"tag_name"' | cut -d'"' -f4)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # TODO: consolidate on exact `--version` once the newest published
      # release supports the flag. This leg leaves VERSION unset so the
      # stub's release-API resolution executes for real; the payload is
      # whatever is newest, checked via its `--help` menu. Published
      # everything (no engine or oxfile overrides), installed to stub
      # defaults on a fresh runner. Own cache dir: the engine install
      # above already populated the default cache with this same tag,
      # so a shared cache would report cached where downloading is
      # asserted.
      - name: Install newest release
        shell: oxdock-engine --script {0}
        env:
          SMOKE_TAG: ${{ steps.smoke-version.outputs.tag }}
          SMOKE_VERSION: ${{ steps.smoke-version.outputs.version }}
          OXDOCK_CACHE_DIR: ${{ runner.temp }}/oxdock-cache-newest
        run: |
          IMPORT [STD]
          INHERIT_ENV [SMOKE_TAG, SMOKE_VERSION, OXDOCK_CACHE_DIR, RUNNER_TEMP, GITHUB_WORKSPACE, GITHUB_TOKEN, GITHUB_PATH, GITHUB_ENV]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          LET $e: PIPE
          LET $o: PIPE
          [family:unix] WITH_IO [stdout=$o, stderr=$e] RUN ["bash", "./install.sh"]
          [family:windows] WITH_IO [stdout=$o, stderr=$e] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\install.ps1"]
          # Full-content match: the announcement is not guaranteed to be
          # the first stderr line on every stub path and platform, so a
          # first-line read goes flaky where a substring holds steady.
          ASSERT_CONTAINS $e "downloading oxdock {{ env:SMOKE_TAG }}"
          ASSERT_CONTAINS $o "installed oxdock {{ env:SMOKE_TAG }} to "
          [family:unix] ASSERT_CONTAINS $o "to {{ env:HOME }}/.local/bin"
          [family:windows] ASSERT_CONTAINS $o "to {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps"
          [family:unix] ASSERT_CONTAINS $o "ensure {{ env:HOME }}/.local/bin is on PATH"
          [family:windows] ASSERT_CONTAINS $o "ensure {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps is on PATH"

          # Configured shell: the stub asks users to put the install dir
          # on PATH, so do that here; bare names below then reach the
          # product on both platforms. Windows needs nothing: WindowsApps
          # is already on PATH.
          [family:unix] ENV PATH="{{ env:HOME }}/.local/bin:{{ env:PATH }}"

          LET $p: PIPE
          WITH_IO [stdout=$p] RUN ["oxdock", "--help"]
          WITH_IO [stdin=$p] READ_LINE $first
          ASSERT_CONTAINS $first "{{ env:SMOKE_VERSION }}"

          LET $q: PIPE
          LET $t: HANDLE = ASYNC {
              WITH_IO [stdout=$q] ECHO "IMPORT [STD]"
              WITH_IO [stdout=$q] ECHO "ECHO via-stdin"
          }
          WITH_IO [stdin=$q] RUN ["oxdock", "--script", "-"]
          AWAIT $t
          ASSERT_CONTAINS stdout "via-stdin"


      - name: Ephemeral run
        shell: oxdock-engine --script {0}
        env:
          VERSION: local-test
          INSTALL_DIR_NIX: ${{ runner.temp }}/oxbin-ephemeral
          INSTALL_DIR_WIN: ${{ runner.temp }}\oxbin-ephemeral

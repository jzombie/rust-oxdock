# Installer smoke: legs run the branch stubs against the staged branch
# build over loopback, on the pinned engine installed as `oxdock-engine`
# so bare `oxdock` means the product just installed. Lint proves stubs
# parse; this proves they install.

name: install-smoke

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Pinned interpreter for every leg below: legs run branch DSL on a
# stable release while the branch engine is still compiling, and the
# action's `latest` default would move under us with no repo diff. Bump
# to a newer tag only after it proves green; an older engine choking on
# new syntax fails loudly at step start, which is the point.
env:
  OXDOCK_PINNED_ENGINE: v0.29.0-alpha
  # Legs run the branch-built engine so unreleased DSL is testable.
  # Deleting this restores the pinned release with no other edits (empty
  # selects release).
  OXDOCK_ENGINE_SOURCE: local

jobs:
  parse:
    name: parse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Static gate before any download runs: shell natively, PowerShell
      # through its own parser API (single quotes keep bash from eating
      # its `$` variables under `set -u`).
      - name: Check install scripts parse
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          pwsh -NoProfile -Command '$e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$e); if ($e.Count -gt 0) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          bash -n scripts/smoke/run-ephemeral.sh
          pwsh -NoProfile -Command '$e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/smoke/run-ephemeral.ps1", [ref]$null, [ref]$e); if ($e.Count -gt 0) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }'

  build:
    name: build (${{ matrix.os }})
    needs: [parse]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, windows-latest, windows-11-arm]
    permissions:
      contents: read
    # The stubs forward GITHUB_TOKEN when present, exactly as real
    # user runs may; loopback fetches ignore it harmlessly.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Temp-file DSL steps resolve the workspace through this, never
      # through the script path: GitHub stages `run:` blocks outside the
      # checkout, so discovery would misresolve without the override.
      OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The engine arrives via the reusable setup action (pinned here;
      # downstream projects omit `version` for latest): platform
      # detection, checksums, and placement already live in the
      # installers, so no asset matrix is repeated. Pin is exact and
      # bumped deliberately; an old engine choking on new syntax fails
      # loudly here rather than haunting later steps. VERSION pins the
      # engine; the branch under test is built from source next.
      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: ${{ env.OXDOCK_PINNED_ENGINE }}
          source: ${{ env.OXDOCK_ENGINE_SOURCE }}

      # The binary under test is this branch, never a published tag:
      # behavior fixes prove before any release ships them. Same build
      # the release ships (all features), by package name. The build
      # doubles as the staged release served below.
      - name: Build branch binary
        id: branch-bin
        shell: oxdock --script {0}
        run: |
          IMPORT [STD]
          INHERIT_ENV [GITHUB_OUTPUT, GITHUB_PATH, GITHUB_WORKSPACE, RUNNER_TEMP]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}

          # Nested cargo builds run isolated in a temp target dir
          # unless told otherwise; pin it to the workspace so the
          # staged paths below resolve. Safe here: no concurrent outer
          # cargo shares this runner job.
          [family:unix] ENV CARGO_TARGET_DIR="{{ env:GITHUB_WORKSPACE }}/target"
          [family:windows] ENV CARGO_TARGET_DIR="{{ env:GITHUB_WORKSPACE }}\\target"

          RUN ["cargo", "build", "--release", "-p", "oxdock", "--all-features"]

          # Identity: the binary must report the manifest version it
          # was built from. Skew fails here, before anything stages.
          LET $manifest: MAP<ANY> = LOAD_TOML("Cargo.toml")
          ECHO "manifest: {{ $manifest.workspace.package.version }}"

          LET $p2: PIPE
          [family:unix] WITH_IO [stdout=$p2] RUN ["{{ env:GITHUB_WORKSPACE }}/target/release/oxdock", "--version"]
          [family:windows] WITH_IO [stdout=$p2] RUN ["{{ env:GITHUB_WORKSPACE }}\\target\\release\\oxdock.exe", "--version"]
          WITH_IO [stdin=$p2] READ_LINE $reported
          ASSERT_EQ $reported "oxdock {{ $manifest.workspace.package.version }}"

          # Stage a local release of the branch build: every leg below
          # fetches through the stub from loopback, so branch bytes
          # prove and no published tag is involved. Layout mirrors a
          # real release asset dir; the target mapping mirrors the stub.
          [os:macos] LET $target: STRING = "aarch64-apple-darwin"
          [os:linux, arch:x86_64] LET $target: STRING = "x86_64-unknown-linux-musl"
          [os:linux, arch:aarch64] LET $target: STRING = "aarch64-unknown-linux-musl"
          [os:windows, arch:x86_64] LET $target: STRING = "x86_64-pc-windows-msvc"
          [os:windows, arch:aarch64] LET $target: STRING = "aarch64-pc-windows-msvc"
          [family:unix] LET $assetbin: STRING = "oxdock"
          [family:windows] LET $assetbin: STRING = "oxdock.exe"
          LET $asset: STRING = "oxdock-{{ $target }}.tar.gz"
          [family:unix] LET $stage: STRING = "{{ env:RUNNER_TEMP }}/oxdock-stage"
          [family:windows] LET $stage: STRING = "{{ env:RUNNER_TEMP }}\\oxdock-stage"
          MKDIR {{ $stage }}
          COPY target/release/{{ $assetbin }} {{ $stage }}/{{ $assetbin }}
          # The piped-delivery legs fetch the stubs themselves over
          # loopback, and every leg fetches the oxfile plus the executing
          # stub from the same base: the stage mirrors a real release
          # asset dir, bundled files included, since the fallbacks are gone.
          COPY install.sh {{ $stage }}/install.sh
          COPY install.ps1 {{ $stage }}/install.ps1
          COPY install.oxfile {{ $stage }}/install.oxfile
          WORKDIR {{ $stage }}

          # Self-hosted pack: the pinned engine carries ARCHIVE, so
          # the stage packs with project vocabulary instead of host
          # tar, whose `D:`-as-remote-tape quirk on Windows forced
          # this relative dance originally.
          ARCHIVE {{ $assetbin }} {{ $asset }}

          # Native hashing: HASH_SHA256 digests each bundled file
          # identically on every platform, so the forged checksums never
          # depend on shell tool output formatting (msys `*` markers and
          # the like would break the stubs' leading-space match). One
          # entry per bundled file, canonical two-space separator, bare
          # installer names exactly as the release writes them.
          LET $p3: PIPE
          WITH_IO [stdout=$p3] HASH_SHA256 {{ $asset }}
          WITH_IO [stdin=$p3] READ_LINE $h_asset
          WITH_IO [stdout=$p3] HASH_SHA256 install.sh
          WITH_IO [stdin=$p3] READ_LINE $h_sh
          WITH_IO [stdout=$p3] HASH_SHA256 install.ps1
          WITH_IO [stdin=$p3] READ_LINE $h_ps1
          WITH_IO [stdout=$p3] HASH_SHA256 install.oxfile
          WITH_IO [stdin=$p3] READ_LINE $h_ox
          WRITE SHA256SUMS "{{ $h_asset }}  {{ $asset }}\n{{ $h_sh }}  install.sh\n{{ $h_ps1 }}  install.ps1\n{{ $h_ox }}  install.oxfile\n"

      # No bare-binary artifact: artifact zips strip the Unix execute
      # bit in transit, and a harness chmod would silently repair a
      # build that shipped a mode-less binary. Legs unpack the engine
      # from this staged asset tarball instead, exactly as users
      # receive it, modes included.
      - name: Upload staged release
        uses: actions/upload-artifact@v4
        with:
          name: smoke-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/oxdock-stage
          retention-days: 1

      # TODO: Update comment/workflow once UNARCHIVE lands in release.
      #
      # Self-bootstrap through the branch engine: download the pinned
      # (previous) release tarball and unpack it with UNARCHIVE, no
      # system tar involved. Proves the branch vocabulary handles real
      # release artifacts end to end. Runs on the branch binary (the
      # pinned engine lacks UNARCHIVE); bash only stages the script
      # file, the work is all DSL.
      - name: Self-bootstrap previous release with branch engine
        shell: bash
        run: |
          set -euo pipefail
          branch_bin="target/release/oxdock"
          if [ "${{ runner.os }}" = "Windows" ]; then
            branch_bin="target/release/oxdock.exe"
          fi
          # Exact identity, shell-stripped: the DSL has no string
          # surgery, so the `v` comes off here like the setup action
          # does for its own handoff check.
          export OXDOCK_EXPECTED_VERSION="${OXDOCK_PINNED_ENGINE#v}"
          script="${RUNNER_TEMP}/self-bootstrap.oxfile"
          cat > "$script" <<'OXDOCK_EOF'
          IMPORT [STD]
          INHERIT_ENV [GITHUB_TOKEN, RUNNER_TEMP, OXDOCK_PINNED_ENGINE, OXDOCK_EXPECTED_VERSION]
          WORKSPACE SYSTEM
          MKDIR {{ env:RUNNER_TEMP }}/self-bootstrap
          WORKDIR {{ env:RUNNER_TEMP }}/self-bootstrap

          # Target mapping mirrors the stub: this leg fetches what the
          # stub would fetch for this runner. macOS qualifies by arch
          # because no x86_64-apple-darwin asset is published: an Intel
          # runner must fail naming that fact, never silently fetch
          # the ARM64 binary into a Bad-CPU-type execution.
          [os:macos, arch:aarch64] LET $target: STRING = "aarch64-apple-darwin"
          [os:macos, arch:x86_64] {
            ECHO "no Intel macOS asset is published; refusing the ARM64 binary"
            EXIT 1
          }
          [os:linux, arch:x86_64] LET $target: STRING = "x86_64-unknown-linux-musl"
          [os:linux, arch:aarch64] LET $target: STRING = "aarch64-unknown-linux-musl"
          [os:windows, arch:x86_64] LET $target: STRING = "x86_64-pc-windows-msvc"
          [os:windows, arch:aarch64] LET $target: STRING = "aarch64-pc-windows-msvc"

          # Two engines, two roles: the branch binary (outer, runs this
          # script) proves the new code; the previous-release binary
          # (inner, extracted below) proves the old artifact unpacks
          # and runs under it. `$prev_engine` is the extracted file
          # itself, executed by absolute path, so junk bytes fail at
          # spawn instead of passing silently.
          [family:unix] LET $prev_engine: STRING = "{{ env:RUNNER_TEMP }}/self-bootstrap/prev/oxdock"
          [family:windows] LET $prev_engine: STRING = "{{ env:RUNNER_TEMP }}/self-bootstrap/prev/oxdock.exe"

          RUN ["curl", "-fsSL", "-H", "Authorization: Bearer {{ env:GITHUB_TOKEN }}", "-o", "prev.tar.gz", "https://github.com/jzombie/rust-oxdock/releases/download/{{ env:OXDOCK_PINNED_ENGINE }}/oxdock-{{ $target }}.tar.gz"]
          RUN ["curl", "-fsSL", "-H", "Authorization: Bearer {{ env:GITHUB_TOKEN }}", "-o", "SHA256SUMS", "https://github.com/jzombie/rust-oxdock/releases/download/{{ env:OXDOCK_PINNED_ENGINE }}/SHA256SUMS"]

          # Integrity before unpack: the computed digest must name a
          # line of the release checksum file. Junk, truncation, or a
          # substituted tarball fails here, never in the unpack below.
          # `grep` does the line lookup because the DSL has no string
          # surgery; the hash itself is computed natively.
          LET $h: PIPE
          WITH_IO [stdout=$h] HASH_SHA256 prev.tar.gz
          WITH_IO [stdin=$h] READ_LINE $computed
          ECHO "verifying sha256: {{ $computed }}"
          RUN ["grep", "-q", "^{{ $computed }} ", "SHA256SUMS"]

          # Freshness: the executed binary must come from this unpack,
          # never a stale dir. A leftover `prev/` is removed first; a
          # fresh tree skips the removal because REMOVE fails closed
          # on missing paths. The kind binds outside the IF because
          # `PATH_TYPE` is AST-only: conditions evaluate over RPN.
          LET $prev_kind: STRING = PATH_TYPE("prev")
          IF $prev_kind != "absent" {
            REMOVE --recursive prev
          }

          UNARCHIVE prev.tar.gz prev

          LET $p: PIPE
          WITH_IO [stdout=$p] RUN [$prev_engine, "--version"]
          WITH_IO [stdin=$p] READ_LINE $reported
          ASSERT_EQ $reported "oxdock {{ env:OXDOCK_EXPECTED_VERSION }}"
          OXDOCK_EOF
          "$branch_bin" --script "$script"

      # TODO: OxDock could resolve latest on its own with a new plugin module
      # dedicated for version tracking, etc.
      #
      # Pinned by the newest-release legs below: the stub resolves the
      # newest tag itself there, and the workflow must expect the same
      # one. Authenticated: shared runner IPs burn the anonymous quota.
      # No `grep -m1`: every stage must consume the body to EOF, else
      # curl fails writing to the closed pipe under pipefail (exit 23).
      # `per_page=1` yields exactly one `tag_name`, so nothing is lost.
      # Stays shell deliberately: stripping the `v` prefix is string
      # surgery the DSL has no vocabulary for, and this is six lines.
      - name: Resolve newest release
        id: smoke-version
        shell: bash
        run: |
          set -euo pipefail
          tag=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/jzombie/rust-oxdock/releases?per_page=1" | grep '"tag_name"' | cut -d'"' -f4)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  install:
    name: install (${{ matrix.os }})
    needs: [parse, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, windows-latest, windows-11-arm]
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download staged release
        uses: actions/download-artifact@v4
        with:
          name: smoke-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/oxdock-stage

      # Bootstrap interpreter only: installed as `oxdock-engine` so the
      # bare `oxdock` name stays free for the binary under test. Pinned,
      # so legs stay within a stable vocabulary.
      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: ${{ env.OXDOCK_PINNED_ENGINE }}
          source: ${{ env.OXDOCK_ENGINE_SOURCE }}
          binary-name: oxdock-engine

      # Every leg below fetches the staged branch build through the
      # stub from loopback: VERSION stays pinned so no release API is
      # involved, and the stub populates a cold cache from the server.
      - name: Install and run
        shell: oxdock-engine --script {0}
        env:
          VERSION: local-test
          SMOKE_PORT: 18731
          # Legs exercise the branch's own installer logic, not whatever
          # main happens to carry. Kept off the job env so the pinned
          # bootstrap stays on the release's own oxfile.
          OXDOCK_OXFILE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/install.oxfile
        run: |
          IMPORT [STD]
          INHERIT_ENV [OXDOCK_OXFILE_URL, SMOKE_PORT, VERSION, RUNNER_TEMP, GITHUB_WORKSPACE, GITHUB_TOKEN, GITHUB_PATH, GITHUB_ENV]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          # Source truth for version identity: the installed binary must
          # report the manifest version. No second binary to compare
          # against: every `oxdock` here is branch bytes already.
          LET $manifest: MAP<ANY> = LOAD_TOML("Cargo.toml")
          # Own loopback port per leg, bound to IPv4 explicitly: a server
          # lingering from an earlier leg must never fail this bind.
          ENV OXDOCK_RELEASE_BASE="http://127.0.0.1:{{ env:SMOKE_PORT }}"
          LET $srv: HANDLE = ASYNC { RUN ["python3", "-m", "http.server", "{{ env:SMOKE_PORT }}", "--bind", "127.0.0.1", "--directory", "{{ env:RUNNER_TEMP }}/oxdock-stage"] }

          # Bounded readiness wait in shell: the DSL has no try/retry, so a
          # slow listener gets 30s and a dead one fails with listener state
          # in the log instead of a bare connect timeout.
          [family:unix] RUN ["sh", "-c", "for i in $(seq 1 30); do curl -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ >/dev/null && exit 0; sleep 1; done; lsof -iTCP:{{ env:SMOKE_PORT }} -sTCP:LISTEN || true; exit 1"]
          [family:windows] RUN ["pwsh", "-NoProfile", "-Command", "for ($i=0; $i -lt 30; $i++) { curl.exe -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ | Out-Null; if ($LASTEXITCODE -eq 0) { exit 0 }; Start-Sleep -Seconds 1 }; Get-NetTCPConnection -LocalPort {{ env:SMOKE_PORT }} -ErrorAction SilentlyContinue; exit 1"]

          LET $o: PIPE
          [family:unix] WITH_IO [stdout=$o] RUN ["bash", "./install.sh"]
          [family:windows] WITH_IO [stdout=$o] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\install.ps1"]
          ASSERT_CONTAINS $o "installed oxdock {{ env:VERSION }} to "
          [family:unix] ASSERT_CONTAINS $o "to {{ env:HOME }}/.local/bin"
          [family:windows] ASSERT_CONTAINS $o "to {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps"
          [family:unix] ASSERT_CONTAINS $o "ensure {{ env:HOME }}/.local/bin is on PATH"
          [family:windows] ASSERT_CONTAINS $o "ensure {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps is on PATH"

          # Configured shell: the stub asks users to put the install dir
          # on PATH, so do that here; bare names below then reach the
          # product on both platforms. Windows needs nothing: WindowsApps
          # is already on PATH.
          [family:unix] ENV PATH="{{ env:HOME }}/.local/bin:{{ env:PATH }}"

          LET $p1: PIPE
          WITH_IO [stdout=$p1] RUN ["oxdock", "--version"]
          WITH_IO [stdin=$p1] READ_LINE $got
          ASSERT_EQ $got "oxdock {{ $manifest.workspace.package.version }}"

          LET $p: PIPE
          LET $t: HANDLE = ASYNC {
              WITH_IO [stdout=$p] ECHO "IMPORT [STD]"
              WITH_IO [stdout=$p] ECHO "ECHO via-stdin"
          }
          WITH_IO [stdin=$p] RUN ["oxdock", "--script", "-"]
          AWAIT $t
          ASSERT_CONTAINS stdout "via-stdin"

          CANCEL $srv

  pipe:
    name: pipe (${{ matrix.os }})
    needs: [parse, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, windows-latest, windows-11-arm]
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download staged release
        uses: actions/download-artifact@v4
        with:
          name: smoke-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/oxdock-stage

      # Bootstrap interpreter only: installed as `oxdock-engine` so the
      # bare `oxdock` name stays free for the binary under test. Pinned,
      # so legs stay within a stable vocabulary.
      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: ${{ env.OXDOCK_PINNED_ENGINE }}
          source: ${{ env.OXDOCK_ENGINE_SOURCE }}
          binary-name: oxdock-engine

      # Piped delivery: the stub arrives on stdin exactly as real users
      # run it, covering the self-consumption class where the drain eats
      # unread script and the engine never runs. Own port and cold cache.
      - name: Install via pipe
        shell: oxdock-engine --script {0}
        env:
          VERSION: local-test
          SMOKE_PORT: 18734
          # Legs exercise the branch's own installer logic, not whatever
          # main happens to carry. Kept off the job env so the pinned
          # bootstrap stays on the release's own oxfile.
          OXDOCK_OXFILE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/install.oxfile
        run: |
          IMPORT [STD]
          INHERIT_ENV [OXDOCK_OXFILE_URL, SMOKE_PORT, VERSION, RUNNER_TEMP, GITHUB_WORKSPACE, GITHUB_TOKEN, GITHUB_PATH, GITHUB_ENV]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          # Source truth for version identity: the installed binary must
          # report the manifest version. No second binary to compare
          # against: every `oxdock` here is branch bytes already.
          LET $manifest: MAP<ANY> = LOAD_TOML("Cargo.toml")
          # Own loopback port for this leg; shared binds flake across legs.
          ENV OXDOCK_RELEASE_BASE="http://127.0.0.1:{{ env:SMOKE_PORT }}"
          LET $srv: HANDLE = ASYNC { RUN ["python3", "-m", "http.server", "{{ env:SMOKE_PORT }}", "--bind", "127.0.0.1", "--directory", "{{ env:RUNNER_TEMP }}/oxdock-stage"] }

          # Bounded readiness wait in shell: the DSL has no try/retry, so a
          # slow listener gets 30s and a dead one fails with listener state
          # in the log instead of a bare connect timeout.
          [family:unix] RUN ["sh", "-c", "for i in $(seq 1 30); do curl -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ >/dev/null && exit 0; sleep 1; done; lsof -iTCP:{{ env:SMOKE_PORT }} -sTCP:LISTEN || true; exit 1"]
          [family:windows] RUN ["pwsh", "-NoProfile", "-Command", "for ($i=0; $i -lt 30; $i++) { curl.exe -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ | Out-Null; if ($LASTEXITCODE -eq 0) { exit 0 }; Start-Sleep -Seconds 1 }; Get-NetTCPConnection -LocalPort {{ env:SMOKE_PORT }} -ErrorAction SilentlyContinue; exit 1"]

          LET $e: PIPE
          LET $o: PIPE
          [family:unix] WITH_IO [stdout=$o, stderr=$e] RUN ["sh", "-c", "curl -fsS http://127.0.0.1:{{ env:SMOKE_PORT }}/install.sh | bash"]
          [family:windows] WITH_IO [stdout=$o, stderr=$e] RUN ["pwsh", "-NoProfile", "-Command", "curl.exe -fsS http://127.0.0.1:{{ env:SMOKE_PORT }}/install.sh | bash"]
          ASSERT_CONTAINS $e "downloading oxdock local-test"
          ASSERT_CONTAINS $o "installed oxdock local-test to "
          [family:unix] ASSERT_CONTAINS $o "to {{ env:HOME }}/.local/bin"
          [family:windows] ASSERT_CONTAINS $o "to {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps"
          [family:unix] ASSERT_CONTAINS $o "ensure {{ env:HOME }}/.local/bin is on PATH"
          [family:windows] ASSERT_CONTAINS $o "ensure {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps is on PATH"

          # Configured shell: the stub asks users to put the install dir
          # on PATH, so do that here; bare names below then reach the
          # product on both platforms. Windows needs nothing: WindowsApps
          # is already on PATH.
          [family:unix] ENV PATH="{{ env:HOME }}/.local/bin:{{ env:PATH }}"

          LET $p1: PIPE
          WITH_IO [stdout=$p1] RUN ["oxdock", "--version"]
          WITH_IO [stdin=$p1] READ_LINE $got
          ASSERT_EQ $got "oxdock {{ $manifest.workspace.package.version }}"

          # Same stub over irm|iex on Windows: the sh pass above warmed
          # the cache, so reuse must report cached, proving cross-stub
          # cache compatibility too.
          [family:windows] LET $e2: PIPE
          [family:windows] LET $o2: PIPE
          [family:windows] WITH_IO [stdout=$o2, stderr=$e2] RUN ["pwsh", "-NoProfile", "-Command", "(irm http://127.0.0.1:{{ env:SMOKE_PORT }}/install.ps1) | iex"]
          [family:windows] ASSERT_CONTAINS $e2 "using cached"
          [family:windows] ASSERT_CONTAINS $o2 "installed oxdock local-test to "
          [family:windows] ASSERT_CONTAINS $o2 "to {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps"
          [family:windows] ASSERT_CONTAINS $o2 "ensure {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps is on PATH"

          CANCEL $srv


  unpacked:
    name: unpacked (${{ matrix.os }})
    needs: [parse, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-26.04-arm, macos-latest, windows-latest, windows-11-arm]
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download staged release
        uses: actions/download-artifact@v4
        with:
          name: smoke-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/oxdock-stage


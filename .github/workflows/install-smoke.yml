# Installer smoke: runs the tree's bootstrap fetchers against real
# releases into temp dirs and executes the installed binary. Static
# checks (lint) prove the stubs parse; this proves they install.
# VERSION stays unset so smoke tracks what users actually get (newest
# release, pre-releases included). Weekly plus on demand; also runs on
# pushes to main so stub changes prove before users meet them.

name: install-smoke

on:
  push:
    branches: [main]
    paths:
      - "bootstrap.sh"
      - "bootstrap.ps1"
      - "install.oxfile"
      - ".oxdock/template/readme/bootstrap.*.tmpl"
  pull_request:
    paths:
      - "bootstrap.sh"
      - "bootstrap.ps1"
      - "install.oxfile"
      - ".oxdock/template/readme/bootstrap.*.tmpl"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  parse:
    name: parse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Static gate before any download runs: shell natively, PowerShell
      # through its own parser API (single quotes keep bash from eating
      # its `$` variables under `set -u`).
      - name: Check bootstrap scripts parse
        shell: bash
        run: |
          set -euo pipefail
          bash -n bootstrap.sh
          pwsh -NoProfile -Command '$e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("bootstrap.ps1", [ref]$null, [ref]$e); if ($e.Count -gt 0) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }'

  smoke:
    name: smoke (${{ matrix.os }})
    needs: [parse]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Resolved once for steps that must not touch network at all:
      # unpinned VERSION queries the API, which would defeat a
      # blackhole proof.
      - name: Resolve smoke version
        id: smoke-version
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$(curl -fsSL "https://api.github.com/repos/jzombie/rust-oxdock/releases?per_page=1" | grep -m1 '"tag_name"' | cut -d'"' -f4)" >> "$GITHUB_OUTPUT"

      - name: Install and run via bootstrap.sh
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          INSTALL_DIR: ${{ runner.temp }}/oxbin
        run: |
          set -euo pipefail
          ./bootstrap.sh
          "${INSTALL_DIR}/oxdock" --version
          printf 'IMPORT [STD]\nECHO "via-stdin"\n' | "${INSTALL_DIR}/oxdock" --script - | grep -q "via-stdin"

      - name: Install and run via bootstrap.ps1
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          INSTALL_DIR: ${{ runner.temp }}\oxbin
        run: |
          $ErrorActionPreference = 'Stop'
          .\bootstrap.ps1
          & (Join-Path $env:INSTALL_DIR 'oxdock.exe') --version
          "IMPORT [STD]`nECHO via-stdin" | & (Join-Path $env:INSTALL_DIR 'oxdock.exe') --script - | Tee-Object (Join-Path $env:RUNNER_TEMP 'stdin.log')
          if (-not (Select-String "via-stdin" (Join-Path $env:RUNNER_TEMP 'stdin.log'))) { throw "stdin delivery failed" }

      # Same job, so $HOME (and the cache) persists: warm reuse must
      # skip downloads, corruption must heal by redownloading. The sh
      # stub announces which path it took; assert on that.
      - name: Reuse and heal cache via bootstrap.sh
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          INSTALL_DIR: ${{ runner.temp }}/oxbin-warm
        run: |
          set -euo pipefail
          ./bootstrap.sh 2>&1 | tee "${RUNNER_TEMP}/warm.log"
          grep -q "using cached" "${RUNNER_TEMP}/warm.log"
          "${INSTALL_DIR}/oxdock" --version
          echo corrupt > "$HOME"/.cache/oxdock/*/*.tar.gz
          ./bootstrap.sh 2>&1 | tee "${RUNNER_TEMP}/healed.log"
          grep -q "downloading" "${RUNNER_TEMP}/healed.log"
          "${INSTALL_DIR}/oxdock" --version

      # No proxy blackhole here: .NET WinHTTP ignores proxy env vars,
      # so it would prove nothing. Warm reuse plus tamper-heal cover
      # the cache contract on this leg.
      - name: Reuse and heal cache via bootstrap.ps1
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        env:
          INSTALL_DIR: ${{ runner.temp }}\oxbin-warm
        run: |
          $ErrorActionPreference = 'Stop'
          .\bootstrap.ps1 2>&1 | Tee-Object (Join-Path $env:RUNNER_TEMP 'warm.log')
          if (-not (Select-String "using cached" (Join-Path $env:RUNNER_TEMP 'warm.log'))) { throw "expected a cache hit" }
          & (Join-Path $env:INSTALL_DIR 'oxdock.exe') --version
          Set-Content -NoNewline -Path (Get-ChildItem $HOME\.cache\oxdock\*\*.tar.gz) -Value 'corrupt'
          .\bootstrap.ps1 2>&1 | Tee-Object (Join-Path $env:RUNNER_TEMP 'healed.log')
          if (-not (Select-String "downloading" (Join-Path $env:RUNNER_TEMP 'healed.log'))) { throw "expected a heal download" }
          & (Join-Path $env:INSTALL_DIR 'oxdock.exe') --version

      # Blackholed egress: with a warm cache and pinned resolution,
      # nothing may leave the machine. Lowercase proxy vars only:
      # GitHub treats env keys case-insensitively, so carrying both
      # cases is a duplicate key and kills the run at startup. The
      # canary first proves the blackhole holds; without it a silently
      # ignored proxy would pass vacuously. Unix legs only (see above).
      - name: Install offline via bootstrap.sh
        if: ${{ runner.os != 'Windows' }}
        shell: bash
        env:
          VERSION: ${{ steps.smoke-version.outputs.version }}
          INSTALL_DIR: ${{ runner.temp }}/oxbin-offline
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
        run: |
          set -euo pipefail
          if curl -fsSL --max-time 15 https://github.com >/dev/null 2>&1; then
            echo "blackhole broken: egress succeeded" >&2
            exit 1
          fi
          ./bootstrap.sh
          "${INSTALL_DIR}/oxdock" --version

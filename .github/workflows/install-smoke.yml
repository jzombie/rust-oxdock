# Installer smoke: every leg runs alone on a fresh runner. Leg bodies
# live inline (`shell: oxdock --script {0}`), one job per leg, platform
# guards inside, so there is no shell logic and no separate script file
# to drift. Static checks (lint) prove the stubs parse; this proves
# they install. The build job compiles the branch once per OS and
# publishes the staged release as an artifact. Legs download it and
# run on the pinned stable engine: branch bytes prove through the
# artifacts under test (branch stub file, branch oxfile, branch asset,
# branch engine override), so legs stay within the pinned vocabulary
# and an old engine choking on new syntax fails loudly at step start.
# Legs install to stub defaults (no per-leg destinations rigged) except
# the ephemeral leg, which names one to prove nothing lands there. One
# leg (newest) instead runs the published release untouched, so the
# documented commands prove against what users actually fetch. Weekly
# plus on demand; also runs on pushes to main so stub changes prove
# before users meet them.

name: install-smoke

on:
  push:
    branches: [main]
    paths:
      - "install.sh"
      - "install.ps1"
      - "install.oxfile"
      - ".oxdock/template/installer/**"
      - ".oxdock/template/cli/**"
      - "scripts/smoke/**"
      - ".github/actions/setup-oxdock/**"
      - ".github/workflows/install-smoke.yml"
  pull_request:
    paths:
      - "install.sh"
      - "install.ps1"
      - "install.oxfile"
      - ".oxdock/template/installer/**"
      - ".oxdock/template/cli/**"
      - "scripts/smoke/**"
      - ".github/actions/setup-oxdock/**"
      - ".github/workflows/install-smoke.yml"
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

# Pinned interpreter for every leg below: legs run branch DSL on a
# stable release while the branch engine is still compiling, and the
# action's `latest` default would move under us with no repo diff. Bump
# to a newer tag only after it proves green; an older engine choking on
# new syntax fails loudly at step start, which is the point.
env:
  OXDOCK_PINNED_ENGINE: v0.24.2-alpha

jobs:
  parse:
    name: parse
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Static gate before any download runs: shell natively, PowerShell
      # through its own parser API (single quotes keep bash from eating
      # its `$` variables under `set -u`).
      - name: Check install scripts parse
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          pwsh -NoProfile -Command '$e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$e); if ($e.Count -gt 0) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }'
          bash -n scripts/smoke/run-ephemeral.sh
          pwsh -NoProfile -Command '$e=$null; [void][System.Management.Automation.Language.Parser]::ParseFile("scripts/smoke/run-ephemeral.ps1", [ref]$null, [ref]$e); if ($e.Count -gt 0) { $e | ForEach-Object { Write-Error $_.Message }; exit 1 }'

  build:
    name: build (${{ matrix.os }})
    needs: [parse]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ""
          - os: macos-latest
            exe: ""
          - os: windows-latest
            exe: ".exe"
    permissions:
      contents: read
    # The stubs forward GITHUB_TOKEN when present, exactly as real
    # user runs may; loopback fetches ignore it harmlessly.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Temp-file DSL steps resolve the workspace through this, never
      # through the script path: GitHub stages `run:` blocks outside the
      # checkout, so discovery would misresolve without the override.
      OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
      # Test the branch's own installer logic, not whatever main happens
      # to carry: head branch on PRs, branch name otherwise. Unset on no
      # known branch would skip the override; every event here has one.
      OXDOCK_OXFILE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/install.oxfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # The engine arrives via the reusable setup action (pinned here;
      # downstream projects omit `version` for latest): platform
      # detection, checksums, and placement already live in the
      # installers, so no asset matrix is repeated. Pin is exact and
      # bumped deliberately; an old engine choking on new syntax fails
      # loudly here rather than haunting later steps. VERSION pins the
      # engine; the branch under test is built from source next.
      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: ${{ env.OXDOCK_PINNED_ENGINE }}

      # The binary under test is this branch, never a published tag:
      # behavior fixes prove before any release ships them. Same build
      # the release ships (all features), by package name. The build
      # doubles as the staged release served below.
      - name: Build branch binary
        id: branch-bin
        shell: oxdock --script {0}
        run: |
          IMPORT [STD]
          INHERIT_ENV [GITHUB_OUTPUT, GITHUB_PATH, GITHUB_WORKSPACE, RUNNER_TEMP]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}

          # Nested cargo builds run isolated in a temp target dir
          # unless told otherwise; pin it to the workspace so the
          # staged paths below resolve. Safe here: no concurrent outer
          # cargo shares this runner job.
          [family:unix] ENV CARGO_TARGET_DIR="{{ env:GITHUB_WORKSPACE }}/target"
          [family:windows] ENV CARGO_TARGET_DIR="{{ env:GITHUB_WORKSPACE }}\\target"

          RUN ["cargo", "build", "--release", "-p", "oxdock", "--all-features"]

          # Identity, exact-free: the binary must report itself, and the
          # manifest version is echoed for the log. Exact equality lives
          # in the release gate, which enforces it authoritatively later.
          LET $manifest: MAP<ANY> = LOAD_TOML("Cargo.toml")
          ECHO "manifest: {{ $manifest.workspace.package.version }}"

          LET $p2: PIPE
          [family:unix] WITH_IO [stdout=$p2] RUN ["{{ env:GITHUB_WORKSPACE }}/target/release/oxdock", "--version"]
          [family:windows] WITH_IO [stdout=$p2] RUN ["{{ env:GITHUB_WORKSPACE }}\\target\\release\\oxdock.exe", "--version"]
          WITH_IO [stdin=$p2] READ_LINE $reported
          ASSERT_CONTAINS $reported "oxdock "

          # Stage a local release of the branch build: every leg below
          # fetches through the stub from loopback, so branch bytes
          # prove and no published tag is involved. Layout mirrors a
          # real release asset dir; the target mapping mirrors the stub.
          [os:macos] LET $target: STRING = "aarch64-apple-darwin"
          [os:linux, arch:x86_64] LET $target: STRING = "x86_64-unknown-linux-musl"
          [os:linux, arch:aarch64] LET $target: STRING = "aarch64-unknown-linux-musl"
          [os:windows, arch:x86_64] LET $target: STRING = "x86_64-pc-windows-msvc"
          [os:windows, arch:aarch64] LET $target: STRING = "aarch64-pc-windows-msvc"
          [family:unix] LET $assetbin: STRING = "oxdock"
          [family:windows] LET $assetbin: STRING = "oxdock.exe"
          LET $asset: STRING = "oxdock-{{ $target }}.tar.gz"
          [family:unix] LET $stage: STRING = "{{ env:RUNNER_TEMP }}/oxdock-stage"
          [family:windows] LET $stage: STRING = "{{ env:RUNNER_TEMP }}\\oxdock-stage"
          MKDIR {{ $stage }}
          COPY target/release/{{ $assetbin }} {{ $stage }}/{{ $assetbin }}
          # The piped-delivery legs fetch the stubs themselves over loopback.
          COPY install.sh {{ $stage }}/install.sh
          COPY install.ps1 {{ $stage }}/install.ps1
          WORKDIR {{ $stage }}

          # Relative archive name: GNU tar reads `host:file` in an
          # absolute Windows path as a remote tape (`D:` looks like a
          # host), so archive from inside the stage dir instead.
          RUN ["tar", "-czf", "{{ $asset }}", "{{ $assetbin }}"]

          # Checksum tool mirrors the stub per platform exactly.
          LET $p3: PIPE
          [os:linux] WITH_IO [stdout=$p3] RUN ["sha256sum", "{{ $asset }}"]
          [os:macos] WITH_IO [stdout=$p3] RUN ["shasum", "-a", "256", "{{ $asset }}"]
          [os:windows] WITH_IO [stdout=$p3] RUN ["sha256sum", "{{ $asset }}"]
          WITH_IO [stdin=$p3] READ_LINE $sums
          WRITE SHA256SUMS "{{ $sums }}"

      # No bare-binary artifact: artifact zips strip the unix execute
      # bit in transit, and a harness chmod would silently repair a
      # build that shipped a mode-less binary. Legs unpack the engine
      # from this staged asset tarball instead, exactly as users
      # receive it, modes included.
      - name: Upload staged release
        uses: actions/upload-artifact@v4
        with:
          name: smoke-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/oxdock-stage
          retention-days: 1

      # TODO: OxDock could resolve latest on its own with a new plugin module
      # dedicated for version tracking, etc.
      #
      # Pinned by the newest-release legs below: the stub resolves the
      # newest tag itself there, and the workflow must expect the same
      # one. Authenticated: shared runner IPs burn the anonymous quota.
      # No `grep -m1`: every stage must consume the body to EOF, else
      # curl fails writing to the closed pipe under pipefail (exit 23).
      # `per_page=1` yields exactly one `tag_name`, so nothing is lost.
      # Stays shell deliberately: stripping the `v` prefix is string
      # surgery the DSL has no vocabulary for, and this is six lines.
      - name: Resolve newest release
        id: smoke-version
        shell: bash
        run: |
          set -euo pipefail
          tag=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/jzombie/rust-oxdock/releases?per_page=1" | grep '"tag_name"' | cut -d'"' -f4)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  install:
    name: install (${{ matrix.os }})
    needs: [parse, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ""
          - os: macos-latest
            exe: ""
          - os: windows-latest
            exe: ".exe"
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
      OXDOCK_OXFILE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/install.oxfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Branch engine unpacks from the staged asset tarball, never as
      # a bare artifact file: tar transit preserves the unix execute
      # bit that artifact zips strip, so the stubs find an executable
      # OXDOCK_ENGINE with no repair step. Windows paths go through
      # cygpath: Git Bash mangles mixed-separator globs otherwise.
      - name: Download staged release
        uses: actions/download-artifact@v4
        with:
          name: smoke-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/oxdock-stage

      - name: Unpack branch engine from staged asset
        shell: bash
        run: |
          stage="${{ runner.temp }}/oxdock-stage"
          dest="${{ github.workspace }}/smoke-bin"
          if [ "${RUNNER_OS:-}" = "Windows" ]; then stage="$(cygpath -u "$RUNNER_TEMP")/oxdock-stage"; dest="$(cygpath -u "$GITHUB_WORKSPACE")/smoke-bin"; fi
          mkdir -p "$dest"
          tar -xzf "$stage"/oxdock-*.tar.gz -C "$dest"

      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: ${{ env.OXDOCK_PINNED_ENGINE }}

      # Every leg below fetches the staged branch build through the
      # stub from loopback: VERSION stays pinned so no release API is
      # involved, and the stub populates a cold cache from the server.
      - name: Install and run
        shell: oxdock --script {0}
        env:
          VERSION: local-test
          SMOKE_PORT: 18731
          OXDOCK_ENGINE: ${{ github.workspace }}/smoke-bin/oxdock${{ matrix.exe }}
        run: |
          IMPORT [STD]
          INHERIT_ENV [OXDOCK_ENGINE, OXDOCK_OXFILE_URL, SMOKE_PORT, VERSION, RUNNER_TEMP, GITHUB_WORKSPACE, HOME, USERPROFILE, LOCALAPPDATA, GITHUB_TOKEN]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          # Own loopback port per leg, bound to IPv4 explicitly: a server
          # lingering from an earlier leg must never fail this bind.
          ENV OXDOCK_RELEASE_BASE="http://127.0.0.1:{{ env:SMOKE_PORT }}"
          LET $srv: HANDLE = ASYNC { RUN ["python3", "-m", "http.server", "{{ env:SMOKE_PORT }}", "--bind", "127.0.0.1", "--directory", "{{ env:RUNNER_TEMP }}/oxdock-stage"] }
          # Bounded readiness wait in shell: the DSL has no try/retry, so a
          # slow listener gets 30s and a dead one fails with listener state
          # in the log instead of a bare connect timeout.
          [family:unix] RUN ["sh", "-c", "for i in $(seq 1 30); do curl -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ >/dev/null && exit 0; sleep 1; done; lsof -iTCP:{{ env:SMOKE_PORT }} -sTCP:LISTEN || true; exit 1"]
          [family:windows] RUN ["pwsh", "-NoProfile", "-Command", "for ($i=0; $i -lt 30; $i++) { curl.exe -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ | Out-Null; if ($LASTEXITCODE -eq 0) { exit 0 }; Start-Sleep -Seconds 1 }; Get-NetTCPConnection -LocalPort {{ env:SMOKE_PORT }} -ErrorAction SilentlyContinue; exit 1"]
          LET $o: PIPE
          [family:unix] WITH_IO [stdout=$o] RUN ["bash", "./install.sh"]
          [family:windows] WITH_IO [stdout=$o] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\install.ps1"]
          ASSERT_CONTAINS $o "installed oxdock {{ env:VERSION }} to "
          [family:unix] ASSERT_CONTAINS $o "to {{ env:HOME }}/.local/bin"
          [family:windows] ASSERT_CONTAINS $o "to {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps"
          [family:unix] ASSERT_CONTAINS $o "ensure {{ env:HOME }}/.local/bin is on PATH"
          [family:windows] ASSERT_CONTAINS $o "ensure {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps is on PATH"
          LET $p1: PIPE
          [family:unix] WITH_IO [stdout=$p1] RUN ["{{ env:HOME }}/.local/bin/oxdock", "--version"]
          [family:windows] WITH_IO [stdout=$p1] RUN ["oxdock", "--version"]
          WITH_IO [stdin=$p1] READ_LINE $got
          LET $p2: PIPE
          WITH_IO [stdout=$p2] RUN ["{{ env:OXDOCK_ENGINE }}", "--version"]
          WITH_IO [stdin=$p2] READ_LINE $want
          ASSERT_EQ $got $want
          LET $p: PIPE
          LET $t: HANDLE = ASYNC {
              WITH_IO [stdout=$p] ECHO "IMPORT [STD]"
              WITH_IO [stdout=$p] ECHO "ECHO via-stdin"
          }
          [family:unix] WITH_IO [stdin=$p] RUN ["{{ env:HOME }}/.local/bin/oxdock", "--script", "-"]
          [family:windows] WITH_IO [stdin=$p] RUN ["oxdock", "--script", "-"]
          AWAIT $t
          ASSERT_CONTAINS stdout "via-stdin"
          CANCEL $srv

  pipe:
    name: pipe (${{ matrix.os }})
    needs: [parse, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ""
          - os: macos-latest
            exe: ""
          - os: windows-latest
            exe: ".exe"
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
      OXDOCK_OXFILE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/install.oxfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Branch engine unpacks from the staged asset tarball, never as
      # a bare artifact file: tar transit preserves the unix execute
      # bit that artifact zips strip, so the stubs find an executable
      # OXDOCK_ENGINE with no repair step. Windows paths go through
      # cygpath: Git Bash mangles mixed-separator globs otherwise.
      - name: Download staged release
        uses: actions/download-artifact@v4
        with:
          name: smoke-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/oxdock-stage

      - name: Unpack branch engine from staged asset
        shell: bash
        run: |
          stage="${{ runner.temp }}/oxdock-stage"
          dest="${{ github.workspace }}/smoke-bin"
          if [ "${RUNNER_OS:-}" = "Windows" ]; then stage="$(cygpath -u "$RUNNER_TEMP")/oxdock-stage"; dest="$(cygpath -u "$GITHUB_WORKSPACE")/smoke-bin"; fi
          mkdir -p "$dest"
          tar -xzf "$stage"/oxdock-*.tar.gz -C "$dest"

      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: ${{ env.OXDOCK_PINNED_ENGINE }}

      # Piped delivery: the stub arrives on stdin exactly as real users
      # run it, covering the self-consumption class where the drain eats
      # unread script and the engine never runs. Own port and cold cache.
      - name: Install via pipe
        shell: oxdock --script {0}
        env:
          VERSION: local-test
          SMOKE_PORT: 18734
          OXDOCK_ENGINE: ${{ github.workspace }}/smoke-bin/oxdock${{ matrix.exe }}
        run: |
          IMPORT [STD]
          INHERIT_ENV [OXDOCK_ENGINE, OXDOCK_OXFILE_URL, SMOKE_PORT, VERSION, RUNNER_TEMP, GITHUB_WORKSPACE, HOME, USERPROFILE, LOCALAPPDATA, GITHUB_TOKEN]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          # Own loopback port for this leg; shared binds flake across legs.
          ENV OXDOCK_RELEASE_BASE="http://127.0.0.1:{{ env:SMOKE_PORT }}"
          LET $srv: HANDLE = ASYNC { RUN ["python3", "-m", "http.server", "{{ env:SMOKE_PORT }}", "--bind", "127.0.0.1", "--directory", "{{ env:RUNNER_TEMP }}/oxdock-stage"] }
          # Bounded readiness wait in shell: the DSL has no try/retry, so a
          # slow listener gets 30s and a dead one fails with listener state
          # in the log instead of a bare connect timeout.
          [family:unix] RUN ["sh", "-c", "for i in $(seq 1 30); do curl -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ >/dev/null && exit 0; sleep 1; done; lsof -iTCP:{{ env:SMOKE_PORT }} -sTCP:LISTEN || true; exit 1"]
          [family:windows] RUN ["pwsh", "-NoProfile", "-Command", "for ($i=0; $i -lt 30; $i++) { curl.exe -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ | Out-Null; if ($LASTEXITCODE -eq 0) { exit 0 }; Start-Sleep -Seconds 1 }; Get-NetTCPConnection -LocalPort {{ env:SMOKE_PORT }} -ErrorAction SilentlyContinue; exit 1"]
          LET $e: PIPE
          LET $o: PIPE
          [family:unix] WITH_IO [stdout=$o, stderr=$e] RUN ["sh", "-c", "curl -fsS http://127.0.0.1:{{ env:SMOKE_PORT }}/install.sh | bash"]
          [family:windows] WITH_IO [stdout=$o, stderr=$e] RUN ["pwsh", "-NoProfile", "-Command", "curl.exe -fsS http://127.0.0.1:{{ env:SMOKE_PORT }}/install.sh | bash"]
          ASSERT_CONTAINS $e "downloading oxdock local-test"
          ASSERT_CONTAINS $o "installed oxdock local-test to "
          [family:unix] ASSERT_CONTAINS $o "to {{ env:HOME }}/.local/bin"
          [family:windows] ASSERT_CONTAINS $o "to {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps"
          LET $p1: PIPE
          [family:unix] WITH_IO [stdout=$p1] RUN ["{{ env:HOME }}/.local/bin/oxdock", "--version"]
          [family:windows] WITH_IO [stdout=$p1] RUN ["oxdock", "--version"]
          WITH_IO [stdin=$p1] READ_LINE $got
          LET $p2: PIPE
          WITH_IO [stdout=$p2] RUN ["{{ env:OXDOCK_ENGINE }}", "--version"]
          WITH_IO [stdin=$p2] READ_LINE $want
          ASSERT_EQ $got $want
          # Same stub over irm|iex on Windows: the sh pass above warmed
          # the cache, so reuse must report cached, proving cross-stub
          # cache compatibility too.
          [family:windows] LET $e2: PIPE
          [family:windows] LET $o2: PIPE
          [family:windows] WITH_IO [stdout=$o2, stderr=$e2] RUN ["pwsh", "-NoProfile", "-Command", "(irm http://127.0.0.1:{{ env:SMOKE_PORT }}/install.ps1) | iex"]
          [family:windows] ASSERT_CONTAINS $e2 "using cached"
          [family:windows] ASSERT_CONTAINS $o2 "installed oxdock local-test to "
          [family:windows] ASSERT_CONTAINS $o2 "to {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps"
          CANCEL $srv


  unpacked:
    name: unpacked (${{ matrix.os }})
    needs: [parse, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ""
          - os: macos-latest
            exe: ""
          - os: windows-latest
            exe: ".exe"
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
      OXDOCK_OXFILE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/install.oxfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download staged release
        uses: actions/download-artifact@v4
        with:
          name: smoke-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/oxdock-stage

      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: ${{ env.OXDOCK_PINNED_ENGINE }}

      # Unpacked engine: no OXDOCK_ENGINE anywhere by design, so the
      # downloaded binary itself runs the installer, the user-visible
      # shape engine-override legs never exercise. Own port, cold cache.
      - name: Install with unpacked engine
        shell: oxdock --script {0}
        env:
          VERSION: local-test
          SMOKE_PORT: 18737
        run: |
          IMPORT [STD]
          INHERIT_ENV [OXDOCK_OXFILE_URL, SMOKE_PORT, VERSION, RUNNER_TEMP, GITHUB_WORKSPACE, HOME, USERPROFILE, LOCALAPPDATA, GITHUB_TOKEN]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          ENV OXDOCK_RELEASE_BASE="http://127.0.0.1:{{ env:SMOKE_PORT }}"
          LET $srv: HANDLE = ASYNC { RUN ["python3", "-m", "http.server", "{{ env:SMOKE_PORT }}", "--bind", "127.0.0.1", "--directory", "{{ env:RUNNER_TEMP }}/oxdock-stage"] }
          # Bounded readiness wait in shell: the DSL has no try/retry, so a
          # slow listener gets 30s and a dead one fails with listener state
          # in the log instead of a bare connect timeout.
          [family:unix] RUN ["sh", "-c", "for i in $(seq 1 30); do curl -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ >/dev/null && exit 0; sleep 1; done; lsof -iTCP:{{ env:SMOKE_PORT }} -sTCP:LISTEN || true; exit 1"]
          [family:windows] RUN ["pwsh", "-NoProfile", "-Command", "for ($i=0; $i -lt 30; $i++) { curl.exe -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ | Out-Null; if ($LASTEXITCODE -eq 0) { exit 0 }; Start-Sleep -Seconds 1 }; Get-NetTCPConnection -LocalPort {{ env:SMOKE_PORT }} -ErrorAction SilentlyContinue; exit 1"]
          LET $e: PIPE
          LET $o: PIPE
          [family:unix] WITH_IO [stdout=$o, stderr=$e] RUN ["sh", "-c", "curl -fsS http://127.0.0.1:{{ env:SMOKE_PORT }}/install.sh | bash"]
          [family:windows] WITH_IO [stdout=$o, stderr=$e] RUN ["pwsh", "-NoProfile", "-Command", "curl.exe -fsS http://127.0.0.1:{{ env:SMOKE_PORT }}/install.sh | bash"]
          ASSERT_CONTAINS $e "downloading oxdock local-test"
          ASSERT_CONTAINS $o "installed oxdock local-test to "
          [family:unix] ASSERT_CONTAINS $o "to {{ env:HOME }}/.local/bin"
          [family:windows] ASSERT_CONTAINS $o "to {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps"
          LET $p: PIPE
          [family:unix] WITH_IO [stdout=$p] RUN ["{{ env:HOME }}/.local/bin/oxdock", "--version"]
          [family:windows] WITH_IO [stdout=$p] RUN ["oxdock", "--version"]
          WITH_IO [stdin=$p] READ_LINE $got
          ASSERT_CONTAINS $got "oxdock "
          CANCEL $srv

  default:
    name: default (${{ matrix.os }})
    needs: [parse, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ""
          - os: macos-latest
            exe: ""
          - os: windows-latest
            exe: ".exe"
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
      OXDOCK_OXFILE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/install.oxfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Branch engine unpacks from the staged asset tarball, never as
      # a bare artifact file: tar transit preserves the unix execute
      # bit that artifact zips strip, so the stubs find an executable
      # OXDOCK_ENGINE with no repair step. Windows paths go through
      # cygpath: Git Bash mangles mixed-separator globs otherwise.
      - name: Download staged release
        uses: actions/download-artifact@v4
        with:
          name: smoke-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/oxdock-stage

      - name: Unpack branch engine from staged asset
        shell: bash
        run: |
          stage="${{ runner.temp }}/oxdock-stage"
          dest="${{ github.workspace }}/smoke-bin"
          if [ "${RUNNER_OS:-}" = "Windows" ]; then stage="$(cygpath -u "$RUNNER_TEMP")/oxdock-stage"; dest="$(cygpath -u "$GITHUB_WORKSPACE")/smoke-bin"; fi
          mkdir -p "$dest"
          tar -xzf "$stage"/oxdock-*.tar.gz -C "$dest"

      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: ${{ env.OXDOCK_PINNED_ENGINE }}

      # Default location: no INSTALL_DIR anywhere by design, so each
      # platform's stub default engages. Windows asserts the real
      # guarantee (bare name resolves, no new shell); unix asserts
      # placement under home. Own port.
      - name: Install default location
        shell: oxdock --script {0}
        env:
          VERSION: local-test
          # Loopback port for this leg; server, probe, and release base derive from it.
          SMOKE_PORT: 18735
          OXDOCK_ENGINE: ${{ github.workspace }}/smoke-bin/oxdock${{ matrix.exe }}
        run: |
          IMPORT [STD]
          INHERIT_ENV [OXDOCK_ENGINE, OXDOCK_OXFILE_URL, SMOKE_PORT, VERSION, RUNNER_TEMP, GITHUB_WORKSPACE, HOME, USERPROFILE, LOCALAPPDATA, GITHUB_TOKEN]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          ENV OXDOCK_RELEASE_BASE="http://127.0.0.1:{{ env:SMOKE_PORT }}"
          LET $srv: HANDLE = ASYNC { RUN ["python3", "-m", "http.server", "{{ env:SMOKE_PORT }}", "--bind", "127.0.0.1", "--directory", "{{ env:RUNNER_TEMP }}/oxdock-stage"] }
          # Bounded readiness wait in shell: the DSL has no try/retry, so a
          # slow listener gets 30s and a dead one fails with listener state
          # in the log instead of a bare connect timeout.
          [family:unix] RUN ["sh", "-c", "for i in $(seq 1 30); do curl -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ >/dev/null && exit 0; sleep 1; done; lsof -iTCP:{{ env:SMOKE_PORT }} -sTCP:LISTEN || true; exit 1"]
          [family:windows] RUN ["pwsh", "-NoProfile", "-Command", "for ($i=0; $i -lt 30; $i++) { curl.exe -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ | Out-Null; if ($LASTEXITCODE -eq 0) { exit 0 }; Start-Sleep -Seconds 1 }; Get-NetTCPConnection -LocalPort {{ env:SMOKE_PORT }} -ErrorAction SilentlyContinue; exit 1"]
          LET $o: PIPE
          [family:unix] WITH_IO [stdout=$o] RUN ["bash", "./install.sh"]
          [family:windows] WITH_IO [stdout=$o] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\install.ps1"]
          ASSERT_CONTAINS $o "installed oxdock {{ env:VERSION }} to "
          [family:unix] ASSERT_CONTAINS $o "to {{ env:HOME }}/.local/bin"
          [family:windows] ASSERT_CONTAINS $o "to {{ env:LOCALAPPDATA }}\\Microsoft\\WindowsApps"
          LET $p: PIPE
          [family:unix] WITH_IO [stdout=$p] RUN ["{{ env:HOME }}/.local/bin/oxdock", "--version"]
          [family:windows] WITH_IO [stdout=$p] RUN ["oxdock", "--version"]
          WITH_IO [stdin=$p] READ_LINE $got
          ASSERT_CONTAINS $got "oxdock "
          CANCEL $srv

  ephemeral:
    name: ephemeral (${{ matrix.os }})
    needs: [parse, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ""
          - os: macos-latest
            exe: ""
          - os: windows-latest
            exe: ".exe"
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
      OXDOCK_OXFILE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/install.oxfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Branch engine unpacks from the staged asset tarball, never as
      # a bare artifact file: tar transit preserves the unix execute
      # bit that artifact zips strip, so the stubs find an executable
      # OXDOCK_ENGINE with no repair step. Windows paths go through
      # cygpath: Git Bash mangles mixed-separator globs otherwise.
      - name: Download staged release
        uses: actions/download-artifact@v4
        with:
          name: smoke-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/oxdock-stage

      - name: Unpack branch engine from staged asset
        shell: bash
        run: |
          stage="${{ runner.temp }}/oxdock-stage"
          dest="${{ github.workspace }}/smoke-bin"
          if [ "${RUNNER_OS:-}" = "Windows" ]; then stage="$(cygpath -u "$RUNNER_TEMP")/oxdock-stage"; dest="$(cygpath -u "$GITHUB_WORKSPACE")/smoke-bin"; fi
          mkdir -p "$dest"
          tar -xzf "$stage"/oxdock-*.tar.gz -C "$dest"

      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: ${{ env.OXDOCK_PINNED_ENGINE }}

      # Ephemeral run: executes the template-rendered one-liners that
      # the README also publishes, so documented commands stay tested.
      - name: Ephemeral run
        shell: oxdock --script {0}
        env:
          VERSION: local-test
          INSTALL_DIR_NIX: ${{ runner.temp }}/oxbin-ephemeral
          INSTALL_DIR_WIN: ${{ runner.temp }}\oxbin-ephemeral
          # Loopback port for this leg; server, probe, and release base derive from it.
          SMOKE_PORT: 18732
          OXDOCK_ENGINE: ${{ github.workspace }}/smoke-bin/oxdock${{ matrix.exe }}
        run: |
          IMPORT [STD]
          INHERIT_ENV [OXDOCK_ENGINE, OXDOCK_OXFILE_URL, SMOKE_PORT, INSTALL_DIR_NIX, INSTALL_DIR_WIN, VERSION, RUNNER_TEMP, GITHUB_WORKSPACE, HOME, USERPROFILE, GITHUB_TOKEN]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          [family:unix] ENV INSTALL_DIR="{{ env:INSTALL_DIR_NIX }}"
          [family:windows] ENV INSTALL_DIR="{{ env:INSTALL_DIR_WIN }}"
          ENV TMPDIR="{{ env:GITHUB_WORKSPACE }}/target/ephemeral-tmp"
          [family:windows] ENV TMP="{{ env:GITHUB_WORKSPACE }}/target/ephemeral-tmp"
          MKDIR "{{ env:GITHUB_WORKSPACE }}/target/ephemeral-tmp"
          # Own loopback port for this leg; shared binds flake across legs.
          ENV OXDOCK_RELEASE_BASE="http://127.0.0.1:{{ env:SMOKE_PORT }}"
          LET $srv: HANDLE = ASYNC { RUN ["python3", "-m", "http.server", "{{ env:SMOKE_PORT }}", "--bind", "127.0.0.1", "--directory", "{{ env:RUNNER_TEMP }}/oxdock-stage"] }
          # Bounded readiness wait in shell: the DSL has no try/retry, so a
          # slow listener gets 30s and a dead one fails with listener state
          # in the log instead of a bare connect timeout.
          [family:unix] RUN ["sh", "-c", "for i in $(seq 1 30); do curl -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ >/dev/null && exit 0; sleep 1; done; lsof -iTCP:{{ env:SMOKE_PORT }} -sTCP:LISTEN || true; exit 1"]
          [family:windows] RUN ["pwsh", "-NoProfile", "-Command", "for ($i=0; $i -lt 30; $i++) { curl.exe -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ | Out-Null; if ($LASTEXITCODE -eq 0) { exit 0 }; Start-Sleep -Seconds 1 }; Get-NetTCPConnection -LocalPort {{ env:SMOKE_PORT }} -ErrorAction SilentlyContinue; exit 1"]
          [family:unix] RUN ["bash", "scripts/smoke/run-ephemeral.sh"]
          [family:windows] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\scripts\\smoke\\run-ephemeral.ps1"]
          ASSERT_CONTAINS stdout "via-ephemeral"
          CANCEL $srv
          LET $t2: STRING = PATH_TYPE("{{ env:INSTALL_DIR }}")
          ASSERT_EQ $t2 "absent"
          FOR $f: STRING IN GLOB("target/ephemeral-tmp/*") {
              ECHO "scratch leaked: {{ $f }}"
              EXIT 1
          }

  newest:
    name: newest (${{ matrix.os }})
    needs: [parse, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: ${{ env.OXDOCK_PINNED_ENGINE }}

      # Pinned by this leg itself: the stub resolves the newest tag
      # here, and the leg expects the same one. Authenticated: shared
      # runner IPs burn the anonymous quota. No `grep -m1`: every stage
      # must consume the body to EOF, else curl fails writing to the
      # closed pipe under pipefail (exit 23). Stays shell deliberately:
      # stripping the `v` prefix is string surgery the DSL has no
      # vocabulary for, and this is six lines.
      - name: Resolve newest release
        id: smoke-version
        shell: bash
        run: |
          set -euo pipefail
          tag=$(curl -fsSL -H "Authorization: Bearer $GITHUB_TOKEN" "https://api.github.com/repos/jzombie/rust-oxdock/releases?per_page=1" | grep '"tag_name"' | cut -d'"' -f4)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # TODO: consolidate on exact `--version` once the newest published
      # release supports the flag. This leg leaves VERSION unset so the
      # stub's release-API resolution executes for real; the payload is
      # whatever is newest, checked via its `--help` menu. Published
      # everything (no engine or oxfile overrides), installed to stub
      # defaults on a fresh runner. Own cache dir: the engine install
      # above already populated the default cache with this same tag,
      # so a shared cache would report cached where downloading is
      # asserted.
      - name: Install newest release
        shell: oxdock --script {0}
        env:
          SMOKE_TAG: ${{ steps.smoke-version.outputs.tag }}
          SMOKE_VERSION: ${{ steps.smoke-version.outputs.version }}
          OXDOCK_CACHE_DIR: ${{ runner.temp }}/oxdock-cache-newest
        run: |
          IMPORT [STD]
          INHERIT_ENV [SMOKE_TAG, SMOKE_VERSION, OXDOCK_CACHE_DIR, RUNNER_TEMP, GITHUB_WORKSPACE, HOME, USERPROFILE, LOCALAPPDATA, GITHUB_TOKEN]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          LET $e: PIPE
          LET $o: PIPE
          [family:unix] WITH_IO [stdout=$o, stderr=$e] RUN ["bash", "./install.sh"]
          [family:windows] WITH_IO [stdout=$o, stderr=$e] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\install.ps1"]
          # Full-content match: the announcement is not guaranteed to be
          # the first stderr line on every stub path and platform, so a
          # first-line read goes flaky where a substring holds steady.
          ASSERT_CONTAINS $e "downloading oxdock {{ env:SMOKE_TAG }}"
          ASSERT_CONTAINS $o "installed oxdock {{ env:SMOKE_TAG }} to "
          LET $p: PIPE
          [family:unix] WITH_IO [stdout=$p] RUN ["{{ env:HOME }}/.local/bin/oxdock", "--help"]
          [family:windows] WITH_IO [stdout=$p] RUN ["oxdock", "--help"]
          WITH_IO [stdin=$p] READ_LINE $first
          ASSERT_CONTAINS $first "{{ env:SMOKE_VERSION }}"
          LET $q: PIPE
          LET $t: HANDLE = ASYNC {
              WITH_IO [stdout=$q] ECHO "IMPORT [STD]"
              WITH_IO [stdout=$q] ECHO "ECHO via-stdin"
          }
          [family:unix] WITH_IO [stdin=$q] RUN ["{{ env:HOME }}/.local/bin/oxdock", "--script", "-"]
          [family:windows] WITH_IO [stdin=$q] RUN ["oxdock", "--script", "-"]
          AWAIT $t
          ASSERT_CONTAINS stdout "via-stdin"

  reuse:
    name: reuse (${{ matrix.os }})
    needs: [parse, build]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: ""
          - os: macos-latest
            exe: ""

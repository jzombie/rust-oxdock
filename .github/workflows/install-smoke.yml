    permissions:
      contents: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
      OXDOCK_OXFILE_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.head_ref || github.ref_name }}/install.oxfile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Branch engine unpacks from the staged asset tarball, never as
      # a bare artifact file: tar transit preserves the unix execute
      # bit that artifact zips strip, so the stubs find an executable
      # OXDOCK_ENGINE with no repair step. Windows paths go through
      # cygpath: Git Bash mangles mixed-separator globs otherwise.
      - name: Download staged release
        uses: actions/download-artifact@v4
        with:
          name: smoke-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/oxdock-stage

      - name: Unpack branch engine from staged asset
        shell: bash
        run: |
          stage="${{ runner.temp }}/oxdock-stage"
          dest="${{ github.workspace }}/smoke-bin"
          if [ "${RUNNER_OS:-}" = "Windows" ]; then stage="$(cygpath -u "$RUNNER_TEMP")/oxdock-stage"; dest="$(cygpath -u "$GITHUB_WORKSPACE")/smoke-bin"; fi
          mkdir -p "$dest"
          tar -xzf "$stage"/oxdock-*.tar.gz -C "$dest"

      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: ${{ env.OXDOCK_PINNED_ENGINE }}

      # Blackholed egress: with a warm cache and pinned resolution,
      # nothing may leave the machine. The cache warms over loopback
      # first; then the proxies blackhole the run and the reinstall
      # must still succeed offline. Lowercase proxy vars only: GitHub
      # treats env keys case-insensitively, so carrying both cases is
      # a duplicate key and kills the run at startup. The canary first
      # proves the blackhole holds; without it a silently ignored proxy
      # would pass vacuously.
      - name: Install offline
        shell: oxdock --script {0}
        env:
          VERSION: local-test
          SMOKE_PORT: 18738
          OXDOCK_ENGINE: ${{ github.workspace }}/smoke-bin/oxdock
        run: |
          IMPORT [STD]
          INHERIT_ENV [OXDOCK_ENGINE, OXDOCK_OXFILE_URL, SMOKE_PORT, VERSION, RUNNER_TEMP, GITHUB_WORKSPACE, HOME, GITHUB_TOKEN]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          ENV OXDOCK_RELEASE_BASE="http://127.0.0.1:{{ env:SMOKE_PORT }}"
          LET $srv: HANDLE = ASYNC { RUN ["python3", "-m", "http.server", "{{ env:SMOKE_PORT }}", "--bind", "127.0.0.1", "--directory", "{{ env:RUNNER_TEMP }}/oxdock-stage"] }
          RUN ["sh", "-c", "for i in $(seq 1 30); do curl -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ >/dev/null && exit 0; sleep 1; done; lsof -iTCP:{{ env:SMOKE_PORT }} -sTCP:LISTEN || true; exit 1"]
          RUN ["bash", "./install.sh"]
          LET $p1: PIPE
          WITH_IO [stdout=$p1] RUN ["{{ env:HOME }}/.local/bin/oxdock", "--version"]
          WITH_IO [stdin=$p1] READ_LINE $got
          ASSERT_CONTAINS $got "oxdock "
          CANCEL $srv
          ENV http_proxy="http://127.0.0.1:9"
          ENV https_proxy="http://127.0.0.1:9"
          RUN ["sh", "-c", "! curl -fsSL --max-time 15 https://github.com"]
          RUN ["bash", "./install.sh"]
          LET $p2: PIPE
          WITH_IO [stdout=$p2] RUN ["{{ env:HOME }}/.local/bin/oxdock", "--version"]
          WITH_IO [stdin=$p2] READ_LINE $got2
          ASSERT_CONTAINS $got2 "oxdock "

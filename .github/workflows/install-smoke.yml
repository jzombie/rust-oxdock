          [family:windows] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\scripts\\smoke\\run-ephemeral.ps1"]
          ASSERT_CONTAINS stdout "via-ephemeral"

          CANCEL $srv

          LET $t2: STRING = PATH_TYPE("{{ env:INSTALL_DIR }}")
          ASSERT_EQ $t2 "absent"


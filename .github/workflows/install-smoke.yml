    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Branch engine unpacks from the staged asset tarball, never as
      # a bare artifact file: tar transit preserves the unix execute
      # bit that artifact zips strip, so the stubs find an executable
      # OXDOCK_ENGINE with no repair step. Windows paths go through
      # cygpath: Git Bash mangles mixed-separator globs otherwise.
      - name: Download staged release
        uses: actions/download-artifact@v4
        with:
          name: smoke-stage-${{ matrix.os }}
          path: ${{ runner.temp }}/oxdock-stage

      - name: Unpack branch engine from staged asset
        shell: bash
        run: |
          stage="${{ runner.temp }}/oxdock-stage"
          dest="${{ github.workspace }}/smoke-bin"
          if [ "${RUNNER_OS:-}" = "Windows" ]; then stage="$(cygpath -u "$RUNNER_TEMP")/oxdock-stage"; dest="$(cygpath -u "$GITHUB_WORKSPACE")/smoke-bin"; fi
          mkdir -p "$dest"
          tar -xzf "$stage"/oxdock-*.tar.gz -C "$dest"

      - name: Install OxDock engine
        uses: ./.github/actions/setup-oxdock
        with:
          version: ${{ env.OXDOCK_PINNED_ENGINE }}

      # Same job, so $HOME (and the cache) persists across runs: the
      # first install primes a cold cache, the second must reuse it,
      # and corruption must heal by redownloading. The stub announces
      # which path it took; assert the announcement stderr.
      - name: Reuse and heal cache
        shell: oxdock --script {0}
        env:
          VERSION: local-test
          SMOKE_PORT: 18733
          OXDOCK_ENGINE: ${{ github.workspace }}/smoke-bin/oxdock${{ matrix.exe }}
        run: |
          IMPORT [STD]
          INHERIT_ENV [OXDOCK_ENGINE, OXDOCK_OXFILE_URL, SMOKE_PORT, VERSION, RUNNER_TEMP, GITHUB_WORKSPACE, HOME, USERPROFILE, LOCALAPPDATA, GITHUB_TOKEN]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          ENV OXDOCK_RELEASE_BASE="http://127.0.0.1:{{ env:SMOKE_PORT }}"
          LET $srv: HANDLE = ASYNC { RUN ["python3", "-m", "http.server", "{{ env:SMOKE_PORT }}", "--bind", "127.0.0.1", "--directory", "{{ env:RUNNER_TEMP }}/oxdock-stage"] }
          # Bounded readiness wait in shell: the DSL has no try/retry, so a
          # slow listener gets 30s and a dead one fails with listener state
          # in the log instead of a bare connect timeout.
          [family:unix] RUN ["sh", "-c", "for i in $(seq 1 30); do curl -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ >/dev/null && exit 0; sleep 1; done; lsof -iTCP:{{ env:SMOKE_PORT }} -sTCP:LISTEN || true; exit 1"]
          [family:windows] RUN ["pwsh", "-NoProfile", "-Command", "for ($i=0; $i -lt 30; $i++) { curl.exe -fs http://127.0.0.1:{{ env:SMOKE_PORT }}/ | Out-Null; if ($LASTEXITCODE -eq 0) { exit 0 }; Start-Sleep -Seconds 1 }; Get-NetTCPConnection -LocalPort {{ env:SMOKE_PORT }} -ErrorAction SilentlyContinue; exit 1"]
          # Prime: cold cache downloads.
          LET $e0: PIPE
          [family:unix] WITH_IO [stderr=$e0] RUN ["bash", "./install.sh"]
          [family:windows] WITH_IO [stderr=$e0] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\install.ps1"]
          ASSERT_CONTAINS $e0 "downloading"
          LET $e1: PIPE
          [family:unix] WITH_IO [stderr=$e1] RUN ["bash", "./install.sh"]
          [family:windows] WITH_IO [stderr=$e1] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\install.ps1"]
          ASSERT_CONTAINS $e1 "using cached"
          LET $h1: PIPE
          [family:unix] WITH_IO [stdout=$h1] RUN ["{{ env:HOME }}/.local/bin/oxdock", "--help"]
          [family:windows] WITH_IO [stdout=$h1] RUN ["oxdock", "--help"]
          WITH_IO [stdin=$h1] READ_LINE $help1
          ASSERT_CONTAINS $help1 "oxdock "
          [os:macos] LET $asset: STRING = "oxdock-aarch64-apple-darwin.tar.gz"
          [os:linux, arch:x86_64] LET $asset: STRING = "oxdock-x86_64-unknown-linux-musl.tar.gz"
          [os:linux, arch:aarch64] LET $asset: STRING = "oxdock-aarch64-unknown-linux-musl.tar.gz"
          [os:windows, arch:x86_64] LET $asset: STRING = "oxdock-x86_64-pc-windows-msvc.tar.gz"
          [os:windows, arch:aarch64] LET $asset: STRING = "oxdock-aarch64-pc-windows-msvc.tar.gz"
          LET $cacheroot: STRING = "{{ env:OXDOCK_CACHE_DIR }}"
          IF $cacheroot == "" {
              [family:unix] $cacheroot = "{{ env:HOME }}/.cache/oxdock"
              [family:windows] $cacheroot = "{{ env:USERPROFILE }}/.cache/oxdock"
          }
          WRITE {{ $cacheroot }}/local-test/{{ $asset }} "corrupt"
          LET $e2: PIPE
          [family:unix] WITH_IO [stderr=$e2] RUN ["bash", "./install.sh"]
          [family:windows] WITH_IO [stderr=$e2] RUN ["pwsh", "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", ".\\install.ps1"]
          ASSERT_CONTAINS $e2 "downloading"
          LET $h2: PIPE
          [family:unix] WITH_IO [stdout=$h2] RUN ["{{ env:HOME }}/.local/bin/oxdock", "--help"]
          [family:windows] WITH_IO [stdout=$h2] RUN ["oxdock", "--help"]
          WITH_IO [stdin=$h2] READ_LINE $help2
          ASSERT_CONTAINS $help2 "oxdock "
          CANCEL $srv


# Release pipeline: thin shim over gha-rust-release.oxfile, which owns the
# release itself (version gate, notes, workspace publish, binaries,
# tag, GitHub release). Dispatch is manual only; nothing else triggers
# this workflow.
#
# One-time setup (repo settings, not code):
# - Secret CARGO_REGISTRY_TOKEN with crates.io publish scope.
# - Environment `release` with required reviewers, so dispatch alone
#   never publishes without a second human approval.
# - `gh` and `tar` ship preinstalled on GitHub-hosted runners;
#   self-hosted runners must provide both.
#
# Asset contract (shared with release.oxfile, keep in sync): each build
# leg archives exactly one file named below into target/artifacts/, and
# the script attaches those three paths to the release. The tag carries
# the version, so asset names stay static across releases.

name: release

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Version to release (must equal the workspace version)"
        required: true
        type: string
      dry_run:
        description: "Dry run only (no publish, binaries, tag, or release)"
        required: false
        default: true
        type: boolean

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: oxdock
            archive: oxdock-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            bin: oxdock
            archive: oxdock-aarch64-apple-darwin.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: oxdock.exe
            archive: oxdock-x86_64-pc-windows-msvc.tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Default features, matching exactly what
      # `cargo install oxdock@<version>` produces.
      - name: Build the release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p oxdock

      - name: Archive the binary
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${{ matrix.archive }}" -C target/release "${{ matrix.bin }}"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}

  release:
    name: release
    runs-on: ubuntu-latest
    needs: [build]
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download build archives
        uses: actions/download-artifact@v4
        with:
          pattern: "oxdock-*"
          merge-multiple: true
          path: target/artifacts

      # No bash logic lives here by design: confirmation gating, notes
      # extraction, publishing, tagging, and releasing all run inside
      # gha-rust-release.oxfile, which fails fast on a mismatched confirmation
      # before anything publishes. This step only bridges inputs.
      - name: Run the release script
        shell: bash
        env:
          OXDOCK_RELEASE_CONFIRM: ${{ inputs.confirm_version }}
          OXDOCK_RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo run -p oxdock --features markdown -- ./gha-rust-release.oxfile

      # The notes file the script extracted: download and read it from
      # the run before approving the real release.
      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: target/release-notes.md

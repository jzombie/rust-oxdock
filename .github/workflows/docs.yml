# Docs pipeline, callable from any repo plus dispatchable here.
#
# Downstream caller (ten lines in the calling repo, pinned by tag).
# Keep both refs identical: GitHub exposes no variable for the ref the
# caller pinned in `uses:`, so the workflow cannot derive it. Mismatched
# pins run one version's logic against another version's scripts.
#
# ```yaml
# jobs:
#   docs:
#     uses: jzombie/rust-oxdock/.github/workflows/docs.yml@v0.24.0-alpha
#     with:
#       pipeline_ref: v0.24.0-alpha
# ```
#
# Conventions a calling repo follows: a Cargo workspace root (used for
# version metadata and workspace discovery), a `docs-gen.json` config,
# and per-target `target.json` plus templates (copy the
# `examples/generic-readme` shape to start: values plus fragments, no
# manifests required beyond the root one). The pipeline checks out this
# repo at `pipeline_ref` for the docs-gen source and builds its runner
# from that source, so callers hold no OxDock code and pin the pipeline
# version explicitly. The stock engine plus `RUST` and `MARKDOWN`
# plugins travel; the `OXDOCK` registry keys only make sense for
# OxDock-based projects, and custom Rust plugins cannot cross the
# boundary (those pipelines still build docs-gen locally).
#
# Every run renders and then fails on drift, so generated docs can
# never go stale silently. Read-only throughout: no secrets, no
# environment, no writes beyond the rendered tree.

name: docs

on:
  workflow_dispatch:
    inputs:
      pipeline_ref:
        description: "Ref of this repo to take docs-gen source from"
        required: true
        type: string
  workflow_call:
    inputs:
      pipeline_ref:
        description: "Ref of this repo to take docs-gen source from"
        required: true
        type: string

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Pipeline source: the docs-gen binary builds from this ref, so
      # callers pin the pipeline version exactly like a dependency.
      - name: Checkout pipeline source
        uses: actions/checkout@v6
        with:
          repository: jzombie/rust-oxdock
          ref: ${{ inputs.pipeline_ref }}
          path: pipeline

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Explicit --root is load-bearing, not redundant: workspace
      # discovery prefers the built binary's own manifest directory over
      # the working directory, so without it the pipeline would render
      # its own tree instead of the caller's. Proven by the fixture
      # smoke test during development.
      - name: Render and check for drift
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path pipeline/crates/docs-gen/Cargo.toml -- --root "$GITHUB_WORKSPACE"
          git diff --exit-code -- . ':!target'

# Docs pipeline, callable from any repo plus dispatchable here.
#
# Downstream caller (eight lines in the calling repo, pinned by tag):
#
# ```yaml
# jobs:
#   docs:
#     uses: jzombie/rust-oxdock/.github/workflows/docs.yml@v0.24.0-alpha
# ```
#
# The pipeline pin derives from the call itself
# (`github.workflow_ref` carries the `uses:` ref): one pin, not two.
#
# Conventions a calling repo follows: a Cargo workspace root (used for
# version metadata and workspace discovery), a `render.json` config,
# and per-target `target.json` plus templates (copy the
# `oxdock-render/examples/generic-readme` shape to start: values plus fragments, no
# manifests required beyond the root one). Callers hold no OxDock code.
# The stock engine plus `RUST` and `MARKDOWN` plugins travel; the
# `OXDOCK` registry keys only make sense for OxDock-based projects,
# and custom Rust plugins cannot cross the boundary (those pipelines
# still build oxdock-render locally).
#
# Every run builds the workspace (so proc-macro outputs are fresh),
# renders, and then fails on drift, so generated docs can never go
# stale silently.
#
# Trust boundary: the render executes repo-controlled templates,
# fragments, and lifecycle files, like a build script. Keep this job
# at contents: read, pass no secrets or environments into it, and do
# not convert it to pull_request_target. The checkout being rendered
# is already trusted code execution.

name: docs

on:
  workflow_dispatch:
  workflow_call:

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The pipeline pin is the call itself: the ref this file was
      # loaded at. DSL-canonical in helpers/ci-helpers.oxfile
      # (PIPELINE_PIN): this bash transcribes it because no engine
      # exists yet at pin time. Branch and tag refs pass through;
      # pull merge refs ride only their own pull_request event, which
      # carries no default-branch cache write. The output is `pin`,
      # never `ref`.
      - name: Resolve pipeline ref
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          case "${GITHUB_WORKFLOW_REF:-}" in
            *@*) ;;
            *)
              echo "unsupported pipeline ref (no '@ref' in workflow ref)" >&2
              exit 1
              ;;
          esac
          pin="${GITHUB_WORKFLOW_REF##*@}"
          case "$pin" in
            refs/tags/*) pin="${pin#refs/tags/}" ;;
            refs/heads/*) pin="${pin#refs/heads/}" ;;
          esac
          if [ -z "$pin" ]; then
            echo "unsupported pipeline ref (empty pin)" >&2
            exit 1
          fi
          case "$pin" in
            refs/pull/*)
              if [ "${GITHUB_EVENT_NAME:-}" != "pull_request" ]; then
                echo "unsupported pipeline ref: $pin" >&2
                exit 1
              fi
              ;;
            refs/*)
              echo "unsupported pipeline ref: $pin" >&2
              exit 1
              ;;
          esac
          echo "pin=$pin" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline source
        uses: actions/checkout@v6
        with:
          repository: jzombie/rust-oxdock
          ref: ${{ steps.pin.outputs.pin }}
          path: pipeline

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Engine and pin confirmation in one call: the action acquires
      # the published binary at the pin (or falls back to source) and
      # re-derives the pin in DSL. It travels with the pipeline
      # checkout, so it stays version-locked to the pin. Downstream
      # callers hold no OxDock code, so this file keeps no local
      # action of its own.
      - name: Acquire and confirm pipeline engine
        uses: ./pipeline/.github/actions/pipeline-engine
        with:
          pin: ${{ steps.pin.outputs.pin }}
          checkout-path: pipeline
          token: ${{ secrets.GITHUB_TOKEN }}

      # Build the caller's workspace first: proc macros (e.g.
      # oxdock_embed! regenerating usage-prebuilt) execute at build
      # time, and the render below reads their outputs. Without this,
      # the drift check can pass on stale macro products.
      - name: Build workspace macros
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace --all-features

      # Explicit --root is load-bearing, not redundant: workspace
      # discovery prefers the built binary's own manifest directory over
      # the working directory, so without it the pipeline would render
      # its own tree instead of the caller's. Proven by the fixture
      # smoke test during development.
      # The --bins build is load-bearing too: the parent spawns the
      # pipe child from beside its own executable, and `cargo run`
      # builds only the default-run bin, so without this the child
      # is missing and the render fails locating it.
      - name: Render and check for drift
        shell: bash
        run: |
          set -euo pipefail
          cargo build --manifest-path pipeline/oxdock-render/Cargo.toml --bins
          cargo run --manifest-path pipeline/oxdock-render/Cargo.toml -- --root "$GITHUB_WORKSPACE"
          git diff --exit-code -- . ':!target'

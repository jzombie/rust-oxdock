# Docs pipeline, callable from any repo plus dispatchable here.
#
# Downstream caller (eight lines in the calling repo, pinned by tag):
#
# ```yaml
# jobs:
#   docs:
#     uses: jzombie/rust-oxdock/.github/workflows/docs.yml@v0.24.0-alpha
# ```
#
# The pipeline pin derives from the call itself
# (`github.workflow_ref` carries the `uses:` ref): one pin, not two.
#
# Conventions a calling repo follows: a Cargo workspace root (used for
# version metadata and workspace discovery), a `docs-gen.json` config,
# and per-target `target.json` plus templates (copy the
# `examples/generic-readme` shape to start: values plus fragments, no
# manifests required beyond the root one). Callers hold no OxDock code.
# The stock engine plus `RUST` and `MARKDOWN` plugins travel; the
# `OXDOCK` registry keys only make sense for OxDock-based projects,
# and custom Rust plugins cannot cross the boundary (those pipelines
# still build docs-gen locally).
#
# Every run builds the workspace (so proc-macro outputs are fresh),
# renders, and then fails on drift, so generated docs can never go
# stale silently. No secrets, no environment; writes stay within the
# rendered tree plus the gitignored build cache.

name: docs

on:
  workflow_dispatch:
  workflow_call:

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The pipeline pin is the call itself: the ref this file was
      # loaded at.
      - name: Resolve pipeline ref
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_WORKFLOW_REF##*@}"
          ref="${ref#refs/tags/}"
          ref="${ref#refs/heads/}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline source
        uses: actions/checkout@v6
        with:
          repository: jzombie/rust-oxdock
          ref: ${{ steps.pin.outputs.ref }}
          path: pipeline

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Build the caller's workspace first: proc macros (e.g.
      # oxdock_embed! regenerating usage-prebuilt) execute at build
      # time, and the render below reads their outputs. Without this,
      # the drift check can pass on stale macro products.
      - name: Build workspace macros
        shell: bash
        run: |
          set -euo pipefail
          cargo build --workspace --all-features

      # Explicit --root is load-bearing, not redundant: workspace
      # discovery prefers the built binary's own manifest directory over
      # the working directory, so without it the pipeline would render
      # its own tree instead of the caller's. Proven by the fixture
      # smoke test during development.
      - name: Render and check for drift
        shell: bash
        run: |
          set -euo pipefail
          cargo run --manifest-path pipeline/crates/docs-gen/Cargo.toml -- --root "$GITHUB_WORKSPACE"
          git diff --exit-code -- . ':!target'

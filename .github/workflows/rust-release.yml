# Release pipeline, callable from any repo plus dispatchable here.
#
# Downstream caller (nine lines in the calling repo, pinned by tag):
#
# ```yaml
# jobs:
#   release:
#     uses: jzombie/rust-oxdock/.github/workflows/rust-release.yml@v0.24.0-alpha
#     with:
#       confirm_version: 1.2.3
#       dry_run: true
#       bins: mytool
#     secrets: inherit
# ```
#
# Products come from `bins:` when set, else the caller's
# `workspace.metadata.oxdock` `release_bins` list. No single-product
# fallback exists: with binaries on and neither source naming a
# product, resolution fails naming the fix.
#
# The pipeline pin derives from the call itself
# (`github.workflow_ref` carries the `uses:` ref), so logic and
# scripts can never mismatch: one pin, not two.
#
# Conventions a calling repo follows (all OxDock defaults here): a
# Cargo workspace whose binary package matches `binary`, a CHANGELOG.md
# with dated `## [<version>] - YYYY-MM-DD` sections (the validate gate
# fails on TBD, misformatted, or impossible dates before the matrix),
# and a `release` environment with
# required reviewers (converge it with .github/scripts/gha-apply-settings.oxfile).
# Callers hold no OxDock code. Asset names derive from `binary`; the
# tag carries the product version.
#
# Explicit behavior contract:
# - `bins` (space-separated) selects the release products, defaulting
#   to the workspace metadata list (`workspace.metadata.oxdock`
#   `release_bins` in the root `Cargo.toml`, read from `cargo
#   metadata`), so adding a product is one manifest entry with no
#   workflow or script change. With binaries on and neither source
#   naming a product, resolution fails naming the fix instead of
#   guessing. Each product builds with all features on five platforms
#   (linux x86_64, linux arm64, macOS arm64, Windows x86_64, Windows
#   arm64) and attaches one `<product>-<target>.tar.gz` per target
#   holding all of the product package's binaries (sidecars like
#   `oxdock-compose-child` ride with their primary automatically).
#   Downloads and registry installs carry the same module surface now
#   that default features enable every module; `--all-features` stays
#   explicit here so test-only extras (mocks, harnesses) ride along
#   too.
# - `binaries: false` (library-only products) skips the build matrix
#   and artifact download entirely; the release ships notes only.
#   Nothing else changes: version gate, publish, tag, and resume
#   semantics are identical.
#
# One-time setup here (repo settings, not code): CARGO_REGISTRY_TOKEN
# secret plus the `release` environment with required reviewers.
# `gh` ships preinstalled on GitHub-hosted runners; self-hosted
# runners must provide it and tar.

name: release

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Version to release (must equal the workspace version)"
        required: true
        type: string
      dry_run:
        description: "Dry run only (no publish, binaries, tag, or release)"
        required: false
        default: true
        type: boolean
      bins:
        description: "Space-separated release products (defaults to the workspace metadata release_bins list)"
        required: false
        default: ""
        type: string
      binaries:
        description: "Build and attach binaries (false for library-only products)"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      confirm_version:
        description: "Version to release (must equal the workspace version)"
        required: true
        type: string
      dry_run:
        description: "Dry run only (no publish, binaries, tag, or release)"
        required: false
        default: true
        type: boolean
      bins:
        description: "Space-separated release products (defaults to the workspace metadata release_bins list)"
        required: false
        default: ""
        type: string
      binaries:
        description: "Build and attach binaries (false for library-only products)"
        required: false
        default: true
        type: boolean
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: "Crates.io token with publish scope"
        required: false

jobs:
  # Fails the run on a mistyped version before the build matrix burns
  # any time. Same confirmation the release script enforces in full;
  # this gate just runs first (defense in depth, not logic in bash).
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The pipeline pin is the call itself: the ref this file was
      # loaded at. Short tags and branches pass through; PR-merge refs
      # pass through verbatim (exactly the code under review).
      - name: Resolve pipeline ref
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_WORKFLOW_REF##*@}"
          ref="${ref#refs/tags/}"
          ref="${ref#refs/heads/}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline source
        uses: actions/checkout@v6
        with:
          repository: jzombie/rust-oxdock
          ref: ${{ steps.pin.outputs.ref }}
          path: rust-release

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Prefer the already-published binary at the pinned ref; fall back
      # to a source build when the ref has no release yet (branch under
      # development). Either way the script comes from the central
      # checkout, so binary and script stay mutually consistent. Shell
      # tar here: cracking the first tarball predates any engine.
      - name: Fail unless the confirmation matches the tree
        shell: bash
        env:
          OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
          RELEASE_CONFIRM: ${{ inputs.confirm_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release download "${{ steps.pin.outputs.ref }}" -R jzombie/rust-oxdock -p "oxdock-x86_64-unknown-linux-musl.tar.gz" -D /tmp/pipeline-dl; then
            mkdir -p /tmp/pipeline-bin
            tar -xzf /tmp/pipeline-dl/oxdock-x86_64-unknown-linux-musl.tar.gz -C /tmp/pipeline-bin
            chmod +x /tmp/pipeline-bin/oxdock
            /tmp/pipeline-bin/oxdock rust-release/.github/scripts/gha-rust-validate.oxfile
          else
            cargo run --manifest-path rust-release/Cargo.toml -p oxdock -- rust-release/.github/scripts/gha-rust-validate.oxfile
          fi

  resolve:
    name: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bins_json: ${{ steps.bins.outputs.bins_json }}
      bins_space: ${{ steps.bins.outputs.bins_space }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The resolver runs on the DSL itself: products come from the
      # manifest through LOAD_TOML, with no shell parsing and no
      # second language in the pipeline.
      - name: Setup resolve engine
        uses: ./.github/actions/setup-oxdock

      # inputs.bins wins when set (one-off override); else the
      # workspace metadata list (adding a product is one Cargo.toml
      # entry). Nothing else: with binaries on and neither source
      # naming a product, this fails naming the fix instead of
      # guessing. Library-only runs (binaries off) resolve empty and
      # ship notes only.
      - name: Resolve release products
        id: bins
        shell: bash
        env:
          OXDOCK_BINS_INPUT: ${{ inputs.bins }}
          OXDOCK_BINARIES: ${{ inputs.binaries }}
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: oxdock ./.github/scripts/gha-rust-resolve.oxfile

  build:
    name: build ${{ matrix.bin }} (${{ matrix.target }})
    if: ${{ inputs.binaries }}
    needs: [validate, resolve]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix:
        bin: ${{ fromJson(needs.resolve.outputs.bins_json) }}
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
          - aarch64-apple-darwin
          - x86_64-pc-windows-msvc
          - aarch64-pc-windows-msvc
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            exe: ""
            cc: musl-gcc
          - target: aarch64-unknown-linux-musl
            os: ubuntu-26.04-arm
            exe: ""
            cc: musl-gcc
          - target: aarch64-apple-darwin
            os: macos-latest
            exe: ""
            cc: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            exe: ".exe"
            cc: ""
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            exe: ".exe"
            cc: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl libc headers and wrapper so C dependencies (ring,
      # aws-lc-sys) compile against musl; the Rust musl targets then
      # link fully static binaries that run in scratch containers.
      - name: Install musl toolchain
        if: ${{ endsWith(matrix.target, 'linux-musl') }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # All features: the release binary carries every module, and
      # default `cargo install` builds now match it. `--all-features`
      # stays explicit here so test-only extras (mocks, harnesses)
      # ride along too.
      - name: Build the release binaries
        shell: bash
        env:
          # Static CRT on MSVC so downloaders need no VCRedist:
          # aws-lc-sys honors it through CARGO_ENCODED_RUSTFLAGS and
          # the Rust code links vcruntime plus UCRT statically.
          RUSTFLAGS: ${{ (startsWith(matrix.os, 'windows') && '-C target-feature=+crt-static') || '' }}
        run: |
          set -euo pipefail
          # Underscores only: dashes are illegal in shell identifiers,
          # and the cc crate reads the underscored TARGET_CC form.
          if [ -n "${{ matrix.cc }}" ]; then
            cc_var="CC_$(echo '${{ matrix.target }}' | tr '-' '_')"
            export "${cc_var}=${{ matrix.cc }}"
          fi
          cargo build --release --target ${{ matrix.target }} -p ${{ matrix.bin }} --all-features

      # NOTE: This step is intentionally kept (see next step).
      #
      # Pack with the release candidate's own engine: setup-oxdock
      # builds the caller's checkout (source: local), so the packer
      # carries the very ARCHIVE under release. A broken ARCHIVE fails
      # this pack before anything publishes: the release proves its own
      # engine. Membership matches the historical pack exactly (every
      # binary of the product package at top level, modes kept); a
      # broken pack fails the runner self-extract below before anything
      # publishes. The duplicate build is an intentional self-hosting
      # proof, not a candidate for reuse of the step above.
      - name: Setup pack engine
        uses: ./.github/actions/setup-oxdock
        with:
          source: local

      # Stage first in DSL: the product set varies per package
      # (sidecars ride along), resolved from the workspace metadata
      # like every other product list here. The ARCHIVE itself still
      # runs under the candidate engine, so the self-hosting proof
      # holds for every product.
      - name: Stage the product binaries
        shell: bash
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}
          OXDOCK_MATRIX_BIN: ${{ matrix.bin }}
          OXDOCK_MATRIX_TARGET: ${{ matrix.target }}
          OXDOCK_MATRIX_EXE: ${{ matrix.exe }}
        run: oxdock ./.github/scripts/gha-rust-stage.oxfile

      # NOTE: This intentionally reuses the candidate engine from the
      # step above instead of the binary from "Build the release
      # binaries": the duplicate build validates the candidate engine
      # by self-hosting the archive step.
      - name: Archive the product
        shell: oxdock --script {0}
        run: |
          INHERIT_ENV [GITHUB_WORKSPACE]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          ARCHIVE target/pkg-stage {{ env:GITHUB_WORKSPACE }}/${{ matrix.bin }}-${{ matrix.target }}.tar.gz

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.bin }}-${{ matrix.target }}.tar.gz
          path: ${{ matrix.bin }}-${{ matrix.target }}.tar.gz

  release:
    name: release
    # Runs when validation and resolution passed and the build succeeded
    # or was skipped (binaries off): a failed or cancelled build still
    # stops everything.
    if: ${{ always() && needs.validate.result == 'success' && needs.resolve.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs: [validate, resolve, build]
    environment: release
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Same derivation as validate: the pin is the call itself.
      - name: Resolve pipeline ref
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_WORKFLOW_REF##*@}"
          ref="${ref#refs/tags/}"
          ref="${ref#refs/heads/}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline source
        uses: actions/checkout@v6
        with:
          repository: jzombie/rust-oxdock
          ref: ${{ steps.pin.outputs.ref }}
          path: rust-release

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download build archives
        if: ${{ inputs.binaries }}
        uses: actions/download-artifact@v4
        with:
          pattern: "*-*.tar.gz"
          merge-multiple: true
          path: target/artifacts

      # Installer files ride the release beside the tarballs so a
      # bootstrap can run logic matching its engine version: the stubs
      # hand off to these copies when the checksums list them. Staged
      # from this checkout, which is the tree being released.
      - name: Stage installer files
        if: ${{ inputs.binaries }}
        shell: bash
        run: |
          set -euo pipefail
          cp install.sh install.ps1 install.oxfile target/artifacts/
          ls target/artifacts/install.sh target/artifacts/install.ps1 target/artifacts/install.oxfile

      # SHA256SUMS rides alongside the tarballs so installers can pin
      # supply chain, not just transit. Written here (gitignored working
      # file, never checked in) and attached by the script like any
      # other asset. Installer entries stay bare filenames: the stubs
      # match ` install.sh` with a leading space, which a `./` prefix
      # would defeat (tarball entries keep their historical `./` form,
      # which their looser patterns tolerate).
      - name: Write checksums file
        if: ${{ inputs.binaries }}
        shell: bash
        run: |
          set -euo pipefail
          (cd target/artifacts && sha256sum ./*.tar.gz install.sh install.ps1 install.oxfile > SHA256SUMS)
          cat target/artifacts/SHA256SUMS

      # Bootstrap engine for the DSL steps below: the release job has
      # no engine of its own yet, and the runner binary is still inside
      # its tarball. Built from this checkout like every other job, so
      # new DSL stays usable here.
      - name: Setup extract engine
        if: ${{ inputs.binaries }}
        uses: ./.github/actions/setup-oxdock
        with:
          source: local

      # Unpack the linux archive for the self-run step below with the
      # checkout's own engine: UNARCHIVE reads the DSL-packed asset
      # and SET_EXECUTABLE guarantees the runner bit, the pack step in
      # reverse. The binary's baked manifest directory points at the
      # build runner, so the self-run step overrides the workspace root
      # back to this tree. System-tar interop stays proven where it
      # matters: the installer stubs unpack every release tarball with
      # the host tar on all five platforms. The runner is always
      # oxdock: it alone carries the MARKDOWN the release script
      # imports, and every product list includes it.
      - name: Extract the release runner
        if: ${{ inputs.binaries }}
        shell: oxdock --script {0}
        run: |
          INHERIT_ENV [GITHUB_WORKSPACE]
          WORKSPACE SYSTEM
          WORKDIR {{ env:GITHUB_WORKSPACE }}
          UNARCHIVE target/artifacts/oxdock-x86_64-unknown-linux-musl.tar.gz target/runner
          SET_EXECUTABLE target/runner/oxdock

      # Self release with artifacts: the fresh matrix binary runs the
      # dispatched branch's script in place. Only this repo qualifies:
      # any other caller's binary lacks the MARKDOWN the script imports.
      - name: Run your branch's gha-rust-release.oxfile with the fresh binary
        if: ${{ github.repository == 'jzombie/rust-oxdock' && inputs.binaries }}
        shell: bash
        env:
          OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
          RELEASE_CONFIRM: ${{ inputs.confirm_version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_BINS: ${{ needs.resolve.outputs.bins_space }}
          RELEASE_BINARIES: ${{ inputs.binaries }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          ./target/runner/oxdock ./.github/scripts/gha-rust-release.oxfile

      # Everything else runs the central script with the central runner:
      # published binary at the derived pin if the ref has a release,
      # else a source build from the central checkout. The caller's own
      # binary is never the runner. Shell tar below for the same
      # reason: the first unpack predates any engine.
      - name: Run OxDock's gha-rust-release.oxfile at the derived pin (published binary, else source build)
        if: ${{ !(github.repository == 'jzombie/rust-oxdock' && inputs.binaries) }}
        shell: bash
        env:
          OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
          RELEASE_CONFIRM: ${{ inputs.confirm_version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_BINS: ${{ needs.resolve.outputs.bins_space }}
          RELEASE_BINARIES: ${{ inputs.binaries }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if gh release download "${{ steps.pin.outputs.ref }}" -R jzombie/rust-oxdock -p "oxdock-x86_64-unknown-linux-musl.tar.gz" -D /tmp/pipeline-dl; then
            mkdir -p /tmp/pipeline-bin
            tar -xzf /tmp/pipeline-dl/oxdock-x86_64-unknown-linux-musl.tar.gz -C /tmp/pipeline-bin
            chmod +x /tmp/pipeline-bin/oxdock
            /tmp/pipeline-bin/oxdock rust-release/.github/scripts/gha-rust-release.oxfile
          else
            cargo run --manifest-path rust-release/Cargo.toml -p oxdock --features markdown -- rust-release/.github/scripts/gha-rust-release.oxfile
          fi

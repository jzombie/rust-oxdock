# Release pipeline, callable from any repo plus dispatchable here.
#
# Downstream caller (nine lines in the calling repo, pinned by tag):
#
# ```yaml
# jobs:
#   release:
#     uses: jzombie/rust-oxdock/.github/workflows/rust-release.yml@v0.24.0-alpha
#     with:
#       confirm_version: 1.2.3
#       dry_run: true
#       binary: mytool
#     secrets: inherit
# ```
#
# The pipeline pin derives from the call itself
# (`github.workflow_ref` carries the `uses:` ref), so logic and
# scripts can never mismatch: one pin, not two.
#
# Conventions a calling repo follows (all OxDock defaults here): a
# Cargo workspace whose binary package matches `binary`, a CHANGELOG.md
# with `## [<version>]` sections, and a `release` environment with
# required reviewers (converge it with scripts/gha/gha-apply-settings.oxfile).
# Callers hold no OxDock code. Asset names derive from `binary`; the
# tag carries the product version.
#
# Explicit behavior contract:
# - `binaries` defaults to true. Exactly one binary (the `binary`
#   input) builds with all features on five platforms (linux x86_64,
#   linux arm64, macOS arm64, Windows x86_64, Windows arm64) and
#   attaches to the release. Downloaders get the most capable binary;
#   registry installers get default features via `cargo install`.
#   Multi-binary products are not supported: one input, one binary.
# - `binaries: false` (library-only products) skips the build matrix
#   and artifact download entirely; the release ships notes only.
#   Nothing else changes: version gate, publish, tag, and resume
#   semantics are identical.
#
# One-time setup here (repo settings, not code): CARGO_REGISTRY_TOKEN
# secret plus the `release` environment with required reviewers.
# `gh` ships preinstalled on GitHub-hosted runners; self-hosted
# runners must provide it and tar.

name: release

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Version to release (must equal the workspace version)"
        required: true
        type: string
      dry_run:
        description: "Dry run only (no publish, binaries, tag, or release)"
        required: false
        default: true
        type: boolean
      binary:
        description: "Binary and package name to build and ship"
        required: false
        default: "oxdock"
        type: string
      binaries:
        description: "Build and attach binaries (false for library-only products)"
        required: false
        default: true
        type: boolean
  workflow_call:
    inputs:
      confirm_version:
        description: "Version to release (must equal the workspace version)"
        required: true
        type: string
      dry_run:
        description: "Dry run only (no publish, binaries, tag, or release)"
        required: false
        default: true
        type: boolean
      binary:
        description: "Binary and package name to build and ship"
        required: false
        default: "oxdock"
        type: string
      binaries:
        description: "Build and attach binaries (false for library-only products)"
        required: false
        default: true
        type: boolean
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: "Crates.io token with publish scope"
        required: false

jobs:
  # Fails the run on a mistyped version before the build matrix burns
  # any time. Same confirmation the release script enforces in full;
  # this gate just runs first (defense in depth, not logic in bash).
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The pipeline pin is the call itself: the ref this file was
      # loaded at. Short tags and branches pass through; PR-merge refs
      # pass through verbatim (exactly the code under review).
      - name: Resolve pipeline ref
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_WORKFLOW_REF##*@}"
          ref="${ref#refs/tags/}"
          ref="${ref#refs/heads/}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline source
        uses: actions/checkout@v6
        with:
          repository: jzombie/rust-oxdock
          ref: ${{ steps.pin.outputs.ref }}
          path: rust-release

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # Prefer the already-published binary at the pinned ref; fall back
      # to a source build when the ref has no release yet (branch under
      # development). Either way the script comes from the central
      # checkout, so binary and script stay mutually consistent.
      - name: Fail unless the confirmation matches the tree
        shell: bash
        env:
          OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
          RELEASE_CONFIRM: ${{ inputs.confirm_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release download "${{ steps.pin.outputs.ref }}" -R jzombie/rust-oxdock -p "oxdock-x86_64-unknown-linux-musl.tar.gz" -D /tmp/pipeline-dl; then
            mkdir -p /tmp/pipeline-bin
            tar -xzf /tmp/pipeline-dl/oxdock-x86_64-unknown-linux-musl.tar.gz -C /tmp/pipeline-bin
            chmod +x /tmp/pipeline-bin/oxdock
            /tmp/pipeline-bin/oxdock rust-release/scripts/gha/gha-rust-validate.oxfile
          else
            cargo run --manifest-path rust-release/Cargo.toml -p oxdock -- rust-release/scripts/gha/gha-rust-validate.oxfile
          fi

  build:
    name: build (${{ matrix.target }})
    if: ${{ inputs.binaries }}
    needs: [validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            exe: ""
            cc: musl-gcc
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
            exe: ""
            cc: musl-gcc
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
            cc: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ".exe"
            cc: ""
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            exe: ".exe"
            cc: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # musl libc headers and wrapper so C dependencies (ring,
      # aws-lc-sys) compile against musl; the Rust musl targets then
      # link fully static binaries that run in scratch containers.
      - name: Install musl toolchain
        if: ${{ endsWith(matrix.target, 'linux-musl') }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # All features: downloaders get the most capable binary (every
      # module, including MARKDOWN). Registry installers still get
      # default features via `cargo install`; that equivalence is a
      # property of the registry path, not the download path.
      - name: Build the release binary
        shell: bash
        env:
          # Static CRT on MSVC so downloaders need no VCRedist:
          # aws-lc-sys honors it through CARGO_ENCODED_RUSTFLAGS and
          # the Rust code links vcruntime plus UCRT statically.
          RUSTFLAGS: ${{ (startsWith(matrix.os, 'windows') && '-C target-feature=+crt-static') || '' }}
        run: |
          set -euo pipefail
          # Underscores only: dashes are illegal in shell identifiers,
          # and the cc crate reads the underscored TARGET_CC form.
          if [ -n "${{ matrix.cc }}" ]; then
            cc_var="CC_$(echo '${{ matrix.target }}' | tr '-' '_')"
            export "${cc_var}=${{ matrix.cc }}"
          fi
          cargo build --release --target ${{ matrix.target }} -p ${{ inputs.binary }} --all-features

      - name: Archive the binary
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${{ inputs.binary }}-${{ matrix.target }}.tar.gz" -C target/${{ matrix.target }}/release "${{ inputs.binary }}${{ matrix.exe }}"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.binary }}-${{ matrix.target }}.tar.gz
          path: ${{ inputs.binary }}-${{ matrix.target }}.tar.gz

  release:
    name: release
    # Runs when validation passed and the build succeeded or was skipped
    # (binaries off): a failed or cancelled build still stops everything.
    if: ${{ always() && needs.validate.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs: [validate, build]
    environment: release
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Same derivation as validate: the pin is the call itself.
      - name: Resolve pipeline ref
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          ref="${GITHUB_WORKFLOW_REF##*@}"
          ref="${ref#refs/tags/}"
          ref="${ref#refs/heads/}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Checkout pipeline source
        uses: actions/checkout@v6
        with:
          repository: jzombie/rust-oxdock
          ref: ${{ steps.pin.outputs.ref }}
          path: rust-release

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download build archives
        if: ${{ inputs.binaries }}
        uses: actions/download-artifact@v4
        with:
          pattern: "${{ inputs.binary }}-*"
          merge-multiple: true
          path: target/artifacts

      # SHA256SUMS rides alongside the tarballs so installers can pin
      # supply chain, not just transit. Written here (gitignored working
      # file, never checked in) and attached by the script like any
      # other asset.
      - name: Write checksums file
        if: ${{ inputs.binaries }}
        shell: bash
        run: |
          set -euo pipefail
          (cd target/artifacts && sha256sum ./*.tar.gz > SHA256SUMS)
          cat target/artifacts/SHA256SUMS

      # Unpack the linux archive for the self-run step below. The
      # binary's baked manifest directory points at the build runner,
      # so that step overrides the workspace root back to this tree.
      - name: Extract the release runner
        if: ${{ inputs.binaries }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/runner
          tar -xzf "target/artifacts/${{ inputs.binary }}-x86_64-unknown-linux-musl.tar.gz" -C target/runner
          chmod +x "target/runner/${{ inputs.binary }}"

      # Self release with artifacts: the fresh matrix binary runs the
      # dispatched branch's script in place. Only this repo qualifies:
      # any other caller's binary lacks the MARKDOWN the script imports.
      - name: Run your branch's gha-rust-release.oxfile with the fresh binary
        if: ${{ github.repository == 'jzombie/rust-oxdock' && inputs.binaries }}
        shell: bash
        env:
          OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
          RELEASE_CONFIRM: ${{ inputs.confirm_version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_BINARY: ${{ inputs.binary }}
          RELEASE_BINARIES: ${{ inputs.binaries }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          ./target/runner/${{ inputs.binary }} ./scripts/gha/gha-rust-release.oxfile

      # Everything else runs the central script with the central runner:
      # published binary at the derived pin if the ref has a release,
      # else a source build from the central checkout. The caller's own
      # binary is never the runner.
      - name: Run OxDock's gha-rust-release.oxfile at the derived pin (published binary, else source build)
        if: ${{ !(github.repository == 'jzombie/rust-oxdock' && inputs.binaries) }}
        shell: bash
        env:
          OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
          RELEASE_CONFIRM: ${{ inputs.confirm_version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_BINARY: ${{ inputs.binary }}
          RELEASE_BINARIES: ${{ inputs.binaries }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          if gh release download "${{ steps.pin.outputs.ref }}" -R jzombie/rust-oxdock -p "oxdock-x86_64-unknown-linux-musl.tar.gz" -D /tmp/pipeline-dl; then
            mkdir -p /tmp/pipeline-bin
            tar -xzf /tmp/pipeline-dl/oxdock-x86_64-unknown-linux-musl.tar.gz -C /tmp/pipeline-bin
            chmod +x /tmp/pipeline-bin/oxdock
            /tmp/pipeline-bin/oxdock rust-release/scripts/gha/gha-rust-release.oxfile
          else
            cargo run --manifest-path rust-release/Cargo.toml -p oxdock --features markdown -- rust-release/scripts/gha/gha-rust-release.oxfile
          fi


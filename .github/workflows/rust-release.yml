# Release pipeline, callable from any repo plus dispatchable here.
#
# Downstream caller (ten lines in the calling repo, pinned by tag).
# Keep both refs identical: GitHub exposes no variable for the ref the
# caller pinned in `uses:`, so the workflow cannot derive it. Mismatched
# pins run one version's logic against another version's scripts.
#
# ```yaml
# jobs:
#   release:
#     uses: jzombie/rust-oxdock/.github/workflows/rust-release.yml@v0.24.0-alpha
#     with:
#       confirm_version: 1.2.3
#       dry_run: true
#       binary: mytool
#       pipeline_ref: v0.24.0-alpha
#     secrets: inherit
# ```
#
# Conventions a calling repo follows (all OxDock defaults here): a
# Cargo workspace whose binary package matches `binary`, a CHANGELOG.md
# with `## [<version>]` sections, and a `release` environment with
# required reviewers (converge it with gha-apply-settings.oxfile).
# The pipeline checks out this repo at `pipeline_ref` for its scripts
# and builds its runner from that source, so callers hold no OxDock
# code and pin the pipeline version explicitly. Asset names derive
# from `binary`; the tag carries the product version.
#
# Explicit behavior contract:
# - `binaries` defaults to true. Exactly one binary (the `binary`
#   input) builds with all features on four platforms (linux x86_64,
#   linux arm64, macOS arm64, Windows x86_64) and attaches to the
#   release. Downloaders get the most capable binary; registry
#   installers get default features via `cargo install`. Multi-binary
#   products are not supported: one input, one binary.
# - `binaries: false` (library-only products) skips the build matrix
#   and artifact download entirely; the release ships notes only.
#   Nothing else changes: version gate, publish, tag, and resume
#   semantics are identical.
#
# One-time setup here (repo settings, not code): CARGO_REGISTRY_TOKEN
# secret plus the `release` environment with required reviewers.
# `gh` ships preinstalled on GitHub-hosted runners; self-hosted
# runners must provide it and tar.

name: release

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: "Version to release (must equal the workspace version)"
        required: true
        type: string
      dry_run:
        description: "Dry run only (no publish, binaries, tag, or release)"
        required: false
        default: true
        type: boolean
      binary:
        description: "Binary and package name to build and ship"
        required: false
        default: "oxdock"
        type: string
      binaries:
        description: "Build and attach binaries (false for library-only products)"
        required: false
        default: true
        type: boolean
      pipeline_ref:
        description: "Ref of this repo to take scripts and runner source from (empty runs the dispatched branch in place: use for bootstrap before the first tag exists)"
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      confirm_version:
        description: "Version to release (must equal the workspace version)"
        required: true
        type: string
      dry_run:
        description: "Dry run only (no publish, binaries, tag, or release)"
        required: false
        default: true
        type: boolean
      binary:
        description: "Binary and package name to build and ship"
        required: false
        default: "oxdock"
        type: string
      binaries:
        description: "Build and attach binaries (false for library-only products)"
        required: false
        default: true
        type: boolean
      pipeline_ref:
        description: "Ref of this repo to take scripts and runner source from"
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        description: "Crates.io token with publish scope"
        required: false

jobs:
  # Fails the run on a mistyped version before the build matrix burns
  # any time. Same confirmation the release script enforces in full;
  # this gate just runs first (defense in depth, not logic in bash).
  validate:
    name: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Pinned pipeline for downstream callers: same split as the
      # release job (empty means local, set means central source).
      - name: Checkout pipeline source
        if: ${{ inputs.pipeline_ref != '' }}
        uses: actions/checkout@v6
        with:
          repository: jzombie/rust-oxdock
          ref: ${{ inputs.pipeline_ref }}
          path: rust-release

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fail unless the confirmation matches the tree (local)
        if: ${{ inputs.pipeline_ref == '' }}
        shell: bash
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          cargo run -p oxdock -- ./gha-rust-validate.oxfile

      - name: Fail unless the confirmation matches the tree (pinned)
        if: ${{ inputs.pipeline_ref != '' }}
        shell: bash
        env:
          OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
          RELEASE_CONFIRM: ${{ inputs.confirm_version }}
        run: |
          set -euo pipefail
          cargo run --manifest-path rust-release/Cargo.toml -p oxdock -- rust-release/gha-rust-validate.oxfile

  build:
    name: build (${{ matrix.target }})
    if: ${{ inputs.binaries }}
    needs: [validate]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            exe: ""
          - os: ubuntu-26.04-arm
            target: aarch64-unknown-linux-gnu
            exe: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            exe: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            exe: ".exe"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # All features: downloaders get the most capable binary (every
      # module, including MARKDOWN). Registry installers still get
      # default features via `cargo install`; that equivalence is a
      # property of the registry path, not the download path.
      - name: Build the release binary
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p ${{ inputs.binary }} --all-features

      - name: Archive the binary
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "${{ inputs.binary }}-${{ matrix.target }}.tar.gz" -C target/release "${{ inputs.binary }}${{ matrix.exe }}"

      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.binary }}-${{ matrix.target }}.tar.gz
          path: ${{ inputs.binary }}-${{ matrix.target }}.tar.gz

  release:
    name: release
    # Runs when validation passed and the build succeeded or was skipped
    # (binaries off): a failed or cancelled build still stops everything.
    if: ${{ always() && needs.validate.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs: [validate, build]
    environment: release
    permissions:
      contents: write
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Pipeline source: scripts plus the runner build. Callers pin this
      # ref explicitly (a tag for stability); this repo dispatches with
      # the branch under release (typically main). Empty means local:
      # the dispatched branch already carries the scripts (bootstrap
      # before the first tag exists), so no second checkout runs.
      - name: Checkout pipeline source
        if: ${{ inputs.pipeline_ref != '' }}
        uses: actions/checkout@v6
        with:
          repository: jzombie/rust-oxdock
          ref: ${{ inputs.pipeline_ref }}
          path: rust-release

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download build archives
        if: ${{ inputs.binaries }}
        uses: actions/download-artifact@v4
        with:
          pattern: "${{ inputs.binary }}-*"
          merge-multiple: true
          path: target/artifacts

      # No bash logic lives here by design: confirmation gating, notes
      # extraction, publishing, tagging, and releasing all run inside
      # the script, which fails fast on a mismatched confirmation
      # before anything publishes. This step only bridges inputs.
      # OXDOCK_WORKSPACE_ROOT is load-bearing, not redundant: workspace
      # discovery prefers the built binary's own manifest directory over
      # the working directory, so without it the CLI would operate on
      # the pipeline checkout instead of the caller tree. The CLI offers
      # no --root flag, so the documented environment override is the
      # mechanism.
      # Local pipeline (empty pipeline_ref): the dispatched branch
      # already holds the scripts, so build and run in place.
      - name: Run the release script
        if: ${{ inputs.pipeline_ref == '' }}
        shell: bash
        env:
          RELEASE_CONFIRM: ${{ inputs.confirm_version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_BINARY: ${{ inputs.binary }}
          RELEASE_BINARIES: ${{ inputs.binaries }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo run -p oxdock --features markdown -- ./gha-rust-release.oxfile

      # Pinned pipeline: runner builds from the central source at the
      # pinned ref, operating on the caller tree via the documented
      # workspace override.
      - name: Run the pinned release script
        if: ${{ inputs.pipeline_ref != '' }}
        shell: bash
        env:
          OXDOCK_WORKSPACE_ROOT: ${{ github.workspace }}
          RELEASE_CONFIRM: ${{ inputs.confirm_version }}
          RELEASE_DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_BINARY: ${{ inputs.binary }}
          RELEASE_BINARIES: ${{ inputs.binaries }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          cargo run --manifest-path rust-release/Cargo.toml -p oxdock --features markdown -- rust-release/gha-rust-release.oxfile

[package]
name = "oxdock-cli"
description = "CLI tooling for executing OxDock's Dockerfile-inspired DSL on native platforms."
categories = ["command-line-utilities"]
keywords = ["cli", "oxdock", "dsl", "workflow"]
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.cargo-udeps.ignore]
# List dependency names to ignore for this package
normal = ["tracing"]
development = []
build = []

[features]
default = ["net"]
net = ["dep:oxdock-net-plugin", "dep:oxdock-remote-proto"]
ssh = ["net", "dep:oxdock-ssh-plugin"]
# Markdown helpers in the CLI runner (oxdock-markdown-plugin). Opt-in so
# default and minimal builds keep their current module surface.
markdown = ["dep:oxdock-markdown-plugin"]

[dependencies]
anyhow.workspace = true
futures-executor.workspace = true
indoc.workspace = true
lexopt.workspace = true
muxio-core.workspace = true
muxio-rpc-service-endpoint.workspace = true
muxio-sync-rpc-server.workspace = true
oxdock-core.workspace = true
oxdock-fs.workspace = true
oxdock-macros.workspace = true
oxdock-markdown-plugin = { workspace = true, optional = true }
oxdock-net-plugin = { workspace = true, optional = true }
oxdock-parser.workspace = true
oxdock-pipe.workspace = true
oxdock-process.workspace = true
oxdock-remote-proto = { workspace = true, optional = true }
oxdock-ssh-plugin = { workspace = true, optional = true }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[dev-dependencies]
oxdock-sys-test-utils.workspace = true

[lints]
workspace = true

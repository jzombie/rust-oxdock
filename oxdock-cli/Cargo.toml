[package]
name = "oxdock-cli"
description = "CLI tooling for executing OxDock's Dockerfile-inspired DSL on native platforms."
categories = ["command-line-utilities"]
keywords = ["cli", "oxdock", "dsl", "workflow"]
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.cargo-udeps.ignore]
# List dependency names to ignore for this package
normal = ["tracing"]
development = []
build = []

[features]
default = ["net"]
net = ["dep:oxdock-net-plugin", "dep:oxdock-remote-proto"]
ssh = ["net", "dep:oxdock-ssh-plugin"]

[dependencies]
anyhow.workspace = true
indoc.workspace = true
lexopt.workspace = true
oxdock-core.workspace = true
oxdock-fs.workspace = true
oxdock-net-plugin = { workspace = true, optional = true }
oxdock-parser.workspace = true
oxdock-pipe.workspace = true
oxdock-process.workspace = true
oxdock-remote-proto = { workspace = true, optional = true }
oxdock-ssh-plugin = { workspace = true, optional = true }
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[dev-dependencies]
oxdock-sys-test-utils.workspace = true

[lints]
workspace = true

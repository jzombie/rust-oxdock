# coverage.toml maps StepKind variants to the case(s) that must exercise them.
# The runner will:
# - Fail if a new StepKind is added but no case is listed here.
# - Fail if a listed case does not actually contain that StepKind.
# - Allow extra cases (guards, escape checks, etc.) via [extras] without claiming
#   StepKind coverage.
[coverage]
Workdir = ["workdir"]
Workspace = ["workspace"]
Env = ["env"]
InheritEnv = ["inherit_env"]
Run = ["run"]
RunExec = ["run_exec_form"]
Echo = ["echo"]
AsyncBlock = ["async_run"]
Copy = ["copy"]
Symlink = ["symlink"]
Mkdir = ["mkdir"]
Ls = ["ls"]
Cwd = ["cwd"]
Read = ["read"]
ReadLine = ["read_line"]
Write = ["write"]
Append = ["append"]
Expand = ["expand"]
AssertFile = ["assert_file"]
AssertDir = ["assert_dir"]
AssertAbsent = ["assert_absent"]
AssertStdout = ["assert_stdout"]
WithIo = ["with_io"]
CopyGit = ["copy_git"]
HashSha256 = ["hash_sha256"]
Exit = ["exit"]
Assign = ["assign"]
AssignCapture = ["let_capture"]
For = ["for_loop"]
If = ["if_statement"]
AssignAsync = ["let_async"]
Await = ["await"]
AwaitCapture = ["await_capture"]
Cancel = ["cancel"]
Timeout = ["timeout"]
Sleep = ["sleep"]

[extras]
cases = [
  "guards",
  "scopes",
  "escape_workdir",
  "escape_write",
  "escape_write_missing",
  "escape_read",
  "escape_symlink",
  "workspace_symlink",
  "semicolon",
  "cat_stdout",
  "cat_stdin",
  "env_target_dir",
  "inherit_env_blocking",
  "cwd_stdout",
  "with_io_async",
  "copy_complex",
  "copy_broken_symlink",
  "with_io_block",
  "write_stdin",
  "async_block_direct",
  "async_run_direct",
  "async_inline_direct_proof",
  "async_proof",
  "ping_pong",
  "timeout_fires",
  "cancel_double",
  "async_timeout",
  "timeout_await",
  "env_quoted_spaces"
]

[package]
name = "docs-gen"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Renders every README in the workspace from shared templates."

# Prototype crate; don't publish with this name
publish = false

[lib]
name = "docs_gen"
path = "src/lib.rs"

[[bin]]
name = "docs-gen"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
oxdock-core.workspace = true
oxdock-fs.workspace = true
oxdock-func-macro.workspace = true
oxdock-macros.workspace = true
# Plugin crates are linked so their HostModules can be introspected
# in-process (static linking requires the edge). The docs path only
# reads metadata; it never serves, connects, or binds.
oxdock-net-plugin.workspace = true
oxdock-parser.workspace = true
oxdock-process.workspace = true
oxdock-ssh-plugin.workspace = true
oxdock-toolchain-plugin.workspace = true
serde_json.workspace = true
toml_edit.workspace = true

[lints]
workspace = true

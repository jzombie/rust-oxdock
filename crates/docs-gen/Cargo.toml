[package]
name = "docs-gen"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
description = "Compatibility pointer to oxdock-render; all logic lives there."

# Compatibility shim; never publish under this name
publish = false

[lib]
name = "docs_gen"
path = "src/lib.rs"

[[bin]]
name = "docs-gen"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
oxdock-render.workspace = true
oxdock-fs.workspace = true

[lints]
workspace = true

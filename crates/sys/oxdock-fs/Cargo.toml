[package]
name = "oxdock-fs"
description = "Guarded filesystem and workspace utilities for OxDock environments."
categories = ["filesystem"]
keywords = ["filesystem", "workspace", "oxdock"]
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[package.metadata.cargo-udeps.ignore]
# List dependency names to ignore for this package
normal = ["tracing"]
development = []
build = []

[features]
mock-fs = []

[dependencies]
anyhow.workspace = true
cache-manager.workspace = true
glob.workspace = true
tempfile.workspace = true
tracing = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
oxdock-sys-test-utils.workspace = true

[lints]
workspace = true

[package]
name = "oxdock-core"
description = "Core engine for OxDock's Dockerfile-inspired compile-time DSL, orchestrating workspace snapshots and asset embedding."
categories = ["development-tools"]
keywords = ["oxdock", "dsl", "orchestration"]
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.cargo-udeps.ignore]
# List dependency names to ignore for this package
normal = ["tracing"]
development = []
build = []

[features]
test-harness = ["oxdock-fs/mock-fs", "oxdock-process/mock-process"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
flate2.workspace = true
indoc.workspace = true
line-ending.workspace = true
oxdock-fs.workspace = true
oxdock-func-macro.workspace = true
oxdock-parser.workspace = true
oxdock-pipe.workspace = true
oxdock-process.workspace = true
oxdock-remote-proto.workspace = true
rand.workspace = true
regex.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
toml.workspace = true

[dev-dependencies]
indoc.workspace = true
oxdock-fs = { workspace = true, features = ["mock-fs"] }
oxdock-pipe.workspace = true
oxdock-process = { workspace = true, features = ["mock-process"] }
oxdock-sys-test-utils.workspace = true
proptest.workspace = true

[lints]
workspace = true

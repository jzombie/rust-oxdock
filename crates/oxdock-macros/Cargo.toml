[package]
name = "oxdock-macros"
description = "Proc macros for OxDock: compile-time embedding, runtime AST construction, and DSL processing."
categories = ["development-tools::procedural-macro-helpers"]
keywords = ["macros", "embed", "oxdock", "compile-time"]
authors.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
proc-macro = true

[dependencies]
anyhow.workspace = true
oxdock-build.workspace = true
oxdock-core = { workspace = true }
oxdock-embed.workspace = true
oxdock-fs.workspace = true
oxdock-parser = { workspace = true, features = ["proc-macro-api"] }
oxdock-process = { workspace = true }
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[dev-dependencies]
oxdock-sys-test-utils.workspace = true

[lints]
workspace = true

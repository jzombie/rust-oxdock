[workspace]
members = [
    "crates/docs-gen",
    "crates/oxdock-core",
    "crates/oxdock-doc-tests",
    "crates/oxdock-embed",
    "crates/oxdock-fixture",
    "crates/oxdock-func-macro",
    "crates/oxdock-logic-tests",
    "crates/oxdock-logic-tests/fixtures/commands/ast_commands",
    "crates/oxdock-parser",
    "crates/plugins/oxdock-net-plugin",
    "crates/plugins/oxdock-ssh-plugin",
    "crates/sys/oxdock-fs",
    "crates/sys/oxdock-pipe",
    "crates/sys/oxdock-process",
    "crates/sys/oxdock-sys-test-utils",
    "oxdock",
    "oxdock-build",
    "oxdock-cli",
    "oxdock-macros",
]
# Bare `cargo run` at the workspace root defaults to the `oxdock` binary.
# `cargo build/test/...` with explicit `--workspace`/`-p` flags are unaffected.
default-members = ["oxdock"]
resolver = "2"

[workspace.package]
authors = ["Jeremy Harris <jeremy.harris@zenosmosis.com>"]
version = "0.17.0-alpha"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jzombie/rust-oxdock"
publish = true

[workspace.dependencies]
anyhow = "1.0.104"
bytes = "1"
glob = "0.3"
indoc = "2.0.7"
lexopt = "0.3.2"
libc = "0.2.189"
libtest-mimic = "0.8.2"
line-ending = "1.5.1"
oxdock = { path = "oxdock", version = "0.17.0-alpha" }
oxdock-build = { path = "oxdock-build", version = "0.17.0-alpha" }
oxdock-cli = { path = "oxdock-cli", version = "0.17.0-alpha" }
oxdock-core = { path = "crates/oxdock-core", version = "0.17.0-alpha" }
oxdock-embed = { path = "crates/oxdock-embed", version = "0.17.0-alpha" }
oxdock-fixture = { path = "crates/oxdock-fixture", version = "0.17.0-alpha" }
oxdock-fs = { path = "crates/sys/oxdock-fs", version = "0.17.0-alpha" }
oxdock-func-macro = { path = "crates/oxdock-func-macro", version = "0.17.0-alpha" }
oxdock-logic-tests = { path = "crates/oxdock-logic-tests", version = "0.17.0-alpha" }
oxdock-macros = { path = "oxdock-macros", version = "0.17.0-alpha" }
oxdock-net-plugin = { path = "crates/plugins/oxdock-net-plugin", version = "0.17.0-alpha" }
oxdock-parser = { path = "crates/oxdock-parser", version = "0.17.0-alpha" }
oxdock-pipe = { path = "crates/sys/oxdock-pipe", version = "0.17.0-alpha" }
oxdock-process = { path = "crates/sys/oxdock-process", version = "0.17.0-alpha" }
oxdock-ssh-plugin = { path = "crates/plugins/oxdock-ssh-plugin", version = "0.17.0-alpha" }
oxdock-sys-test-utils = { path = "crates/sys/oxdock-sys-test-utils", version = "0.17.0-alpha" }
pest = { version = "2.9.0", default-features = false, features = ["std"] }
pest_derive = "2.9.0"
portable-pty = "0.9"
proc-macro2 = "1.0.107"
proptest = "1.11.0"
quote = "1.0.47"
rand = "0.10"
russh = { version = "0.63.3", default-features = false, features = ["aws-lc-rs"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
syn = { version = "3.0.4", features = ["full", "visit"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "io-util"] }
toml = "1.1.4"
toml_edit = "0.25.13"
tracing = "0.1.44"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

[workspace]
members = [
    "crates/oxdock-core",
    "crates/oxdock-doc-tests",
    "crates/oxdock-embed",
    "crates/oxdock-fixture",
    "crates/oxdock-logic-tests",
    "crates/oxdock-parser",
    "crates/sys/oxdock-fs",
    "crates/sys/oxdock-process",
    "crates/sys/oxdock-sys-test-utils",
    "oxdock-buildtime-helpers",
    "oxdock-buildtime-macros",
    "oxdock-cli",
]
resolver = "2"

[workspace.package]
authors = ["Jeremy Harris <jeremy.harris@zenosmosis.com>"]
version = "0.6.0-alpha"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jzombie/oxdock-rs"
publish = true

[workspace.dependencies]
anyhow = "1.0.104"
indoc = "2.0.7"
libc = "0.2.189"
libtest-mimic = "0.8.2"
line-ending = "1.5.1"
oxdock-buildtime-helpers = { path = "oxdock-buildtime-helpers", version = "0.6.0-alpha" }
oxdock-buildtime-macros = { path = "oxdock-buildtime-macros", version = "0.6.0-alpha" }
oxdock-core = { path = "crates/oxdock-core", version = "0.6.0-alpha" }
oxdock-embed = { path = "crates/oxdock-embed", version = "0.6.0-alpha" }
oxdock-fixture = { path = "crates/oxdock-fixture", version = "0.6.0-alpha" }
oxdock-fs = { path = "crates/sys/oxdock-fs", version = "0.6.0-alpha" }
oxdock-parser = { path = "crates/oxdock-parser", version = "0.6.0-alpha" }
oxdock-process = { path = "crates/sys/oxdock-process", version = "0.6.0-alpha" }
oxdock-sys-test-utils = { path = "crates/sys/oxdock-sys-test-utils", version = "0.6.0-alpha" }
pest = { version = "2.9.0", default-features = false, features = ["std"] }
pest_derive = "2.9.0"
proc-macro2 = "1.0.107"
proptest = "1.11.0"
quote = "1.0.47"
sha2 = "0.11.0"
syn = { version = "2.0.119", features = ["full", "visit"] }
tempfile = "3.27.0"
toml_edit = "0.25.13"
tracing = "0.1.44"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading"] }

[workspace.lints.clippy]
disallowed_methods = "deny"
disallowed_types = "deny"
disallowed_macros = "deny"

# =====================================================================
# Setup OxDock for GitHub Actions: one product per call.
#
# Installs the `oxdock` interpreter or the `oxdock-render` binary.
# `release` (default) fetches the versioned stub and pipes it to the
# host shell; `local` builds the caller's checkout with cargo so
# unreleased behavior is testable before any tag exists. Inputs cross
# on `env:`; every decision lives in the stub. Stubs are fetched,
# never vendored. One call installs one product; use two steps to
# install both.
#
# GENERATED by oxdock-render from `.oxdock/template/github-actions/`:
# do not edit by hand.
# =====================================================================
name: Setup OxDock
description: Install the oxdock interpreter or oxdock-render binary for CI steps.
branding:
  icon: terminal
  color: blue

inputs:
  version:
    description: Full release tag to install (e.g. v0.43.0-alpha), or `latest` to resolve the newest release. Ignored when source is `local`.
    required: false
    default: latest
  source:
    description: Product provenance (`release` downloads the installer for `version`; `local` builds the caller's checkout with cargo, so unreleased behavior is testable before any tag exists). An empty value behaves as `release`.
    required: false
    default: release
  product:
    description: Which product to install (`oxdock` is the DSL interpreter; `oxdock-render` is the renderer binary).
    required: false
    default: oxdock
  binary-name:
    description: Installed executable stem (empty keeps the product default; `oxdock-engine` frees the bare `oxdock` name for a binary under test).
    required: false
    default: ''

runs:
  using: composite
  steps:
    # ---- Validate inputs ------------------------------------------------
    # Fail fast on typos so a bad value never silently falls through
    # to the release path.
    - name: Validate source input
      if: ${{ inputs.source != '' && inputs.source != 'release' && inputs.source != 'local' }}
      shell: bash
      env:
        OXDOCK_SOURCE: ${{ inputs.source }}
      run: |
        echo "Invalid source '$OXDOCK_SOURCE': must be '', 'release', or 'local'" >&2
        exit 1

    - name: Validate product input
      if: ${{ inputs.product != 'oxdock' && inputs.product != 'oxdock-render' }}
      shell: bash
      env:
        OXDOCK_PRODUCT_INPUT: ${{ inputs.product }}
      run: |
        echo "Invalid product '$OXDOCK_PRODUCT_INPUT': must be 'oxdock' or 'oxdock-render'" >&2
        exit 1

    # ---- Release installs -----------------------------------------------
    # One leg per shell serves both products: the product flows through
    # `OXDOCK_PRODUCT` and the install dir suffix resolves from it.
    # Each URL appears once; the auth header attaches only when
    # GITHUB_TOKEN is set.
    # Unix release leg (bash).
    - name: Install OxDock (${{ inputs.product }})
      if: ${{ inputs.source != 'local' && runner.os != 'Windows' }}
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ runner.temp }}/${{ inputs.product == 'oxdock-render' && 'oxdock-render' || 'oxdock-engine' }}
        OXDOCK_PRODUCT: ${{ inputs.product }}
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        curl -fsSL ${GITHUB_TOKEN:+-H "Authorization: Bearer $GITHUB_TOKEN"} https://raw.githubusercontent.com/jzombie/rust-oxdock/main/install.sh | bash

    # Windows release leg (pwsh).
    - name: Install OxDock (${{ inputs.product }})
      if: ${{ inputs.source != 'local' && runner.os == 'Windows' }}
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
        INSTALL_DIR: ${{ runner.temp }}/${{ inputs.product == 'oxdock-render' && 'oxdock-render' || 'oxdock-engine' }}
        OXDOCK_PRODUCT: ${{ inputs.product }}
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        $h = @{}; if ($env:GITHUB_TOKEN) { $h.Authorization = "Bearer $env:GITHUB_TOKEN" }; (irm 'https://raw.githubusercontent.com/jzombie/rust-oxdock/main/install.ps1' -Headers $h) | iex

    # ---- Toolchain ------------------------------------------------------
    # `local` builds only: release installs never need cargo.
    - name: Install Rust
      if: ${{ inputs.source == 'local' }}
      uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

    # ---- Local builds ---------------------------------------------------
    # One leg per shell; the product flows through `OXDOCK_PRODUCT`.
    # Only the truly product-specific parts (cargo package set,
    # renderer sidecars) branch on it.
    # Unix local-build leg (bash).
    - name: Build local OxDock (${{ inputs.product }})
      if: ${{ inputs.source == 'local' && runner.os != 'Windows' }}
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        OXDOCK_PRODUCT: ${{ inputs.product }}
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
        INSTALL_DIR: ${{ runner.temp }}/${{ inputs.product == 'oxdock-render' && 'oxdock-render' || 'oxdock-engine' }}
      run: |
        set -euo pipefail
        TARGET_DIR="${CARGO_TARGET_DIR:-target}"
        if [ "$OXDOCK_PRODUCT" = 'oxdock-render' ]; then
          cargo build --release -p oxdock -p oxdock-render --bins --all-features
        else
          cargo build --release -p oxdock
        fi
        mkdir -p "$INSTALL_DIR"
        BINARY_NAME="${OXDOCK_BINARY_NAME:-$OXDOCK_PRODUCT}"
        cp "$TARGET_DIR/release/$OXDOCK_PRODUCT" "$INSTALL_DIR/$BINARY_NAME"
        if [ "$OXDOCK_PRODUCT" = 'oxdock-render' ]; then
          for f in "$TARGET_DIR"/release/oxdock-render-*; do
            [ -f "$f" ] || continue
            case "$f" in *.d|*.pdb) continue;; *) cp "$f" "$INSTALL_DIR/";; esac
          done
        fi
        echo "$INSTALL_DIR" >> "$GITHUB_PATH"

    # Windows local-build leg (pwsh).
    - name: Build local OxDock (${{ inputs.product }})
      if: ${{ inputs.source == 'local' && runner.os == 'Windows' }}
      shell: pwsh
      working-directory: ${{ github.workspace }}
      env:
        OXDOCK_PRODUCT: ${{ inputs.product }}
        OXDOCK_BINARY_NAME: ${{ inputs.binary-name }}
        INSTALL_DIR: ${{ runner.temp }}/${{ inputs.product == 'oxdock-render' && 'oxdock-render' || 'oxdock-engine' }}
      run: |
        $ErrorActionPreference='Stop'
        $targetDir = if ($env:CARGO_TARGET_DIR) { $env:CARGO_TARGET_DIR } else { 'target' }
        $product = $env:OXDOCK_PRODUCT
        if ($product -eq 'oxdock-render') {
          cargo build --release -p oxdock -p oxdock-render --bins --all-features
        } else {
          cargo build --release -p oxdock
        }
        $installDir = $env:INSTALL_DIR
        New-Item -ItemType Directory -Force -Path $installDir | Out-Null
        $binaryName = if ($env:OXDOCK_BINARY_NAME) { $env:OXDOCK_BINARY_NAME } else { $product }
        Copy-Item (Join-Path $targetDir "release/$product.exe") (Join-Path $installDir "$binaryName.exe")
        if ($product -eq 'oxdock-render') {
          Get-ChildItem (Join-Path $targetDir 'release/oxdock-render-*') -File | Where-Object { $_.Extension -notin @('.d', '.pdb') } | ForEach-Object { Copy-Item $_.FullName $installDir }
        }
        Add-Content -Path $env:GITHUB_PATH -Value $installDir
